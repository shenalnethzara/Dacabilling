<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="/dacabilling-splash-logo.png" />
<script src="/config.js"></script>
  <img
  src="/dacabilling-splash-logo.png"
  alt="DacaBilling"
  style="width: 260px; display: block; margin: 40px auto;"
/>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DacaBilling</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    /* Dark mode before first paint (no white flash) */
    try { var t = localStorage.getItem('dacaTheme');
      if (t === 'dark' || (!t && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.setAttribute('data-theme', 'dark');
    } catch (e) {}
  </script>
  <style>
/* ============================================================
   DacaBilling - CSS.html
   Design system: tokens, layout, components, responsive rules.
   ============================================================ */
:root {
  --bg: #F4F6FB;
  --surface: #FFFFFF;
  --surface-2: #F8FAFC;
  --text: #0F172A;
  --text-2: #334155;
  --muted: #64748B;
  --border: #E2E8F0;
  --border-2: #CBD5E1;
  --primary: #4F46E5;
  --primary-600: #4338CA;
  --primary-50: #EEF2FF;
  --primary-100: #E0E7FF;
  --success: #15803D;
  --success-50: #DCFCE7;
  --warning: #B45309;
  --warning-50: #FEF3C7;
  --danger: #DC2626;
  --danger-50: #FEE2E2;
  --info: #0369A1;
  --info-50: #E0F2FE;
  --sidebar: #0B1220;
  --sidebar-2: #131C2E;
  --sidebar-text: #CBD5E1;
  --radius: 12px;
  --radius-sm: 8px;
  --shadow-sm: 0 1px 2px rgba(15, 23, 42, .06);
  --shadow: 0 1px 3px rgba(15, 23, 42, .08), 0 4px 16px rgba(15, 23, 42, .05);
  --shadow-lg: 0 20px 50px rgba(15, 23, 42, .18);
  --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  font-family: var(--font); font-size: 14px; line-height: 1.5; color: var(--text);
  background: var(--bg); -webkit-font-smoothing: antialiased;
}
a { color: var(--primary); text-decoration: none; }
a:hover { text-decoration: underline; }
h1, h2, h3, h4 { margin: 0; line-height: 1.25; color: var(--text); }
h1 { font-size: 22px; font-weight: 700; letter-spacing: -.01em; }
h2 { font-size: 17px; font-weight: 600; }
h3 { font-size: 15px; font-weight: 600; }
.hidden { display: none !important; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.nowrap { white-space: nowrap; }
.right { text-align: right; }
.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.mt-0 { margin-top: 0; } .mt-1 { margin-top: 8px; } .mt-2 { margin-top: 16px; } .mt-3 { margin-top: 24px; }
.flex { display: flex; align-items: center; gap: 8px; }
.flex-wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
svg.ic { width: 18px; height: 18px; flex-shrink: 0; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- Boot & loader ---------- */
.boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: var(--muted); }
.spinner { width: 34px; height: 34px; border: 3px solid var(--primary-100); border-top-color: var(--primary); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.loader { position: fixed; inset: 0; background: rgba(244, 246, 251, .55); z-index: 900; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(1px); }
.topline { position: fixed; top: 0; left: 0; height: 3px; width: 100%; z-index: 950; background: linear-gradient(90deg, transparent, var(--primary), transparent); background-size: 50% 100%; background-repeat: no-repeat; animation: slide 1s linear infinite; }
@keyframes slide { from { background-position: -50% 0; } to { background-position: 150% 0; } }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  height: 38px; padding: 0 15px; border-radius: var(--radius-sm); border: 1px solid transparent;
  font: 600 13.5px var(--font); cursor: pointer; white-space: nowrap; transition: background .15s, border-color .15s, box-shadow .15s;
  background: var(--surface); color: var(--text-2); border-color: var(--border);
}
.btn:hover { background: var(--surface-2); border-color: var(--border-2); text-decoration: none; }
.btn:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--primary-100); }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn svg.ic { width: 16px; height: 16px; }
.btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
.btn-primary:hover { background: var(--primary-600); border-color: var(--primary-600); }
.btn-success { background: var(--success); color: #fff; border-color: var(--success); }
.btn-success:hover { background: #166534; }
.btn-danger { background: var(--danger); color: #fff; border-color: var(--danger); }
.btn-danger:hover { background: #B91C1C; }
.btn-ghost { background: transparent; border-color: transparent; }
.btn-ghost:hover { background: var(--surface-2); border-color: transparent; }
.btn-soft-danger { color: var(--danger); }
.btn-soft-danger:hover { background: var(--danger-50); border-color: #FECACA; }
.btn-wa { background: #16A34A; color: #fff; border-color: #16A34A; }
.btn-wa:hover { background: #15803D; }
.btn-sm { height: 32px; padding: 0 11px; font-size: 12.5px; }
.btn-icon { width: 34px; height: 34px; padding: 0; }
.btn-block { width: 100%; }
.btn-lg { height: 44px; font-size: 14.5px; }

/* ---------- Forms ---------- */
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 16px; }
.form-grid.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.form-grid .full { grid-column: 1 / -1; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label, .lbl { font-size: 12.5px; font-weight: 600; color: var(--text-2); }
.field .req { color: var(--danger); }
.field .hint { font-size: 11.5px; color: var(--muted); }
.input, input[type=text], input[type=password], input[type=email], input[type=number], input[type=date], input[type=tel], input[type=search], select, textarea {
  width: 100%; height: 40px; padding: 0 12px; border: 1px solid var(--border-2); border-radius: var(--radius-sm);
  font: 400 14px var(--font); color: var(--text); background: #fff; transition: border-color .15s, box-shadow .15s;
}
textarea { height: auto; min-height: 84px; padding: 10px 12px; resize: vertical; line-height: 1.45; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-100); }
input[readonly] { background: var(--surface-2); color: var(--muted); }
input[type=color] { width: 48px; height: 40px; padding: 3px; border: 1px solid var(--border-2); border-radius: var(--radius-sm); background: #fff; cursor: pointer; }
.check { display: flex; align-items: center; gap: 9px; font-size: 13.5px; cursor: pointer; user-select: none; }
.check input { width: 17px; height: 17px; accent-color: var(--primary); }
.input-icon { position: relative; }
.input-icon svg.ic { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--muted); width: 16px; height: 16px; }
.input-icon input { padding-left: 34px; }
.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 3px; gap: 3px; }
.seg button { white-space: nowrap; border: 0; background: transparent; padding: 6px 12px; border-radius: 6px; font: 600 12.5px var(--font); color: var(--muted); cursor: pointer; }
.seg button.active { background: #fff; color: var(--primary); box-shadow: var(--shadow-sm); }

/* ---------- Cards ---------- */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-sm); }
.card-pad { padding: 20px; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px 12px; flex-wrap: wrap; padding: 16px 20px; border-bottom: 1px solid var(--border); }
.card-body { padding: 20px; }
.card + .card { margin-top: 16px; }
.kpi-grid > .card, .dash-grid > .card, .biz-grid > .card, .editor-grid .card, .view-grid .card { margin-top: 0; }
.editor-grid > div > .card + .card { margin-top: 0; }
.section-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 12px; }

/* ---------- Badges ---------- */
.badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 600; white-space: nowrap; }
.badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.badge-paid { background: var(--success-50); color: var(--success); }
.badge-partial { background: var(--warning-50); color: var(--warning); }
.badge-pending { background: var(--primary-50); color: var(--primary-600); }
.badge-cancelled { background: #F1F5F9; color: #64748B; }
.badge-overdue { background: var(--danger-50); color: var(--danger); }
.badge-converted { background: #EDE9FE; color: #5B21B6; }
.badge-voided { background: #F1F5F9; color: #64748B; text-decoration: line-through; }
.badge-soon { background: rgba(255,255,255,.08); color: #94A3B8; font-size: 10px; padding: 2px 7px; margin-left: auto; }
.badge-soon::before { display: none; }

/* ---------- Tables ---------- */
.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table.table { width: 100%; border-collapse: collapse; }
.table th { text-align: left; font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 11px 16px; background: var(--surface-2); border-bottom: 1px solid var(--border); white-space: nowrap; }
.table td { padding: 12px 16px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.table tbody tr:last-child td { border-bottom: 0; }
.table tbody tr.clickable { cursor: pointer; }
.table tbody tr.clickable:hover td { background: #FAFBFF; }
.table th.num, .table td.num { text-align: right; }
.table .actions { text-align: right; white-space: nowrap; }
.table .strong { font-weight: 600; }
.t-voided td { color: var(--muted); }
.t-voided .amount { text-decoration: line-through; }

/* ---------- Empty states ---------- */
.empty { text-align: center; padding: 48px 20px; color: var(--muted); }
.empty .empty-ic { width: 52px; height: 52px; border-radius: 14px; background: var(--primary-50); color: var(--primary); display: inline-flex; align-items: center; justify-content: center; margin-bottom: 12px; }
.empty .empty-ic svg.ic { width: 24px; height: 24px; }
.empty h3 { margin-bottom: 4px; }
.empty p { margin: 0 0 16px; }

/* ---------- Auth screens ---------- */
.auth-view { min-height: 100%; display: grid; grid-template-columns: 1.05fr 1fr; }
.auth-hero { background: radial-gradient(1200px 600px at -10% -20%, #6366F1 0%, transparent 60%), linear-gradient(160deg, #0B1220 0%, #1E1B4B 100%); color: #E0E7FF; padding: 56px; display: flex; flex-direction: column; justify-content: space-between; }
.auth-hero h1 { color: #fff; font-size: 34px; letter-spacing: -.02em; margin: 18px 0 12px; }
.auth-hero p { color: #A5B4FC; font-size: 15.5px; max-width: 440px; margin: 0; }
.auth-hero ul { list-style: none; padding: 0; margin: 28px 0 0; display: grid; gap: 12px; }
.auth-hero li { display: flex; gap: 10px; align-items: center; color: #C7D2FE; }
.auth-hero li svg.ic { color: #818CF8; }
.auth-panel { display: flex; align-items: center; justify-content: center; padding: 40px 24px; }
.auth-card { width: 100%; max-width: 400px; }
.auth-card h2 { font-size: 24px; font-weight: 700; margin-bottom: 6px; }
.auth-card .sub { color: var(--muted); margin: 0 0 26px; }
.auth-card form { display: grid; gap: 16px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; letter-spacing: -.01em; }
.brand-mark { width: 36px; height: 36px; border-radius: 10px; background: linear-gradient(135deg, #6366F1, #8B5CF6); color: #fff; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 18px rgba(99, 102, 241, .35); }
.brand-mark svg.ic { width: 20px; height: 20px; }
.pw-wrap { position: relative; }
.pw-wrap input { padding-right: 44px; }
.pw-wrap button { position: absolute; right: 4px; top: 4px; height: 32px; width: 36px; border: 0; background: transparent; color: var(--muted); cursor: pointer; border-radius: 6px; }
.alert { padding: 11px 14px; border-radius: var(--radius-sm); font-size: 13px; display: flex; gap: 9px; align-items: flex-start; }
.alert-error { background: var(--danger-50); color: #991B1B; }
.alert-info { background: var(--info-50); color: #075985; }
.alert-warn { background: var(--warning-50); color: #92400E; }
.alert svg.ic { margin-top: 1px; width: 16px; height: 16px; }

/* ---------- Business selector ---------- */
.biz-view { min-height: 100%; }
.biz-top { display: flex; align-items: center; justify-content: space-between; padding: 18px 32px; background: var(--surface); border-bottom: 1px solid var(--border); }
.biz-wrap { max-width: 1040px; margin: 0 auto; padding: 40px 24px 60px; }
.biz-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 18px; margin-top: 26px; }
.biz-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 22px; display: flex; flex-direction: column; gap: 14px; box-shadow: var(--shadow-sm); transition: transform .15s, box-shadow .15s, border-color .15s; cursor: pointer; }
.biz-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); border-color: var(--primary-100); }
.biz-card .logo { width: 56px; height: 56px; border-radius: 12px; background: var(--primary-50); color: var(--primary); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 20px; overflow: hidden; border: 1px solid var(--border); }
.biz-card .logo img { width: 100%; height: 100%; object-fit: contain; background: #fff; }
.biz-card .meta { color: var(--muted); font-size: 12.5px; display: grid; gap: 3px; }
.biz-card .foot { display: flex; gap: 8px; margin-top: auto; }
.biz-add { border: 2px dashed var(--border-2); background: transparent; box-shadow: none; align-items: center; justify-content: center; text-align: center; color: var(--muted); min-height: 220px; }
.biz-add:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-50); }
.biz-add .plus { width: 46px; height: 46px; border-radius: 50%; background: var(--primary-50); color: var(--primary); display: flex; align-items: center; justify-content: center; }

/* ---------- App layout ---------- */
.app { display: flex; min-height: 100%; }
.sidebar { width: 252px; flex-shrink: 0; background: var(--sidebar); color: var(--sidebar-text); display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; z-index: 300; }
.sb-head { padding: 18px 18px 14px; }
.sb-head .brand { color: #fff; }
.sb-biz { margin: 4px 12px 10px; padding: 10px 12px; border-radius: 10px; background: var(--sidebar-2); display: flex; align-items: center; gap: 10px; cursor: pointer; border: 1px solid rgba(255,255,255,.05); }
.sb-biz:hover { background: #1A2540; }
.sb-biz .logo { width: 34px; height: 34px; border-radius: 8px; background: #fff; color: var(--primary); display: flex; align-items: center; justify-content: center; font-weight: 700; overflow: hidden; flex-shrink: 0; }
.sb-biz .logo img { width: 100%; height: 100%; object-fit: contain; }
.sb-biz .name { color: #fff; font-weight: 600; font-size: 13.5px; }
.sb-biz .sub { font-size: 11.5px; color: #94A3B8; }
.sb-nav { flex: 1; overflow-y: auto; padding: 6px 10px 12px; }
.sb-label { font-size: 10.5px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: #64748B; padding: 14px 10px 6px; }
.nav-item { display: flex; align-items: center; gap: 11px; padding: 9px 11px; border-radius: 8px; color: var(--sidebar-text); cursor: pointer; font-weight: 500; font-size: 13.5px; margin-bottom: 2px; border: 0; background: transparent; width: 100%; text-align: left; font-family: var(--font); }
.nav-item:hover { background: rgba(255,255,255,.06); color: #fff; }
.nav-item.active { background: rgba(99, 102, 241, .18); color: #fff; }
.nav-item.active svg.ic { color: #A5B4FC; }
.nav-item.disabled { opacity: .55; cursor: default; }
.nav-item.disabled:hover { background: transparent; color: var(--sidebar-text); }
.sb-foot { padding: 12px 10px 16px; border-top: 1px solid rgba(255,255,255,.06); }
.sb-user { display: flex; align-items: center; gap: 10px; padding: 8px 10px 10px; }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, #6366F1, #8B5CF6); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; flex-shrink: 0; }
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar { height: 60px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; padding: 0 24px; position: sticky; top: 0; z-index: 200; }
.topbar .title { font-weight: 600; font-size: 15px; }
.menu-btn { display: none; }
.page { padding: 24px; max-width: 1320px; width: 100%; margin: 0 auto; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
.page-head p { margin: 4px 0 0; color: var(--muted); }
.page-head .actions { display: flex; gap: 8px; flex-wrap: wrap; }
.sidebar-backdrop { display: none; }

/* ---------- Dashboard ---------- */
.kpi-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.kpi { padding: 18px; display: flex; flex-direction: column; gap: 10px; }
.kpi .top { display: flex; align-items: center; justify-content: space-between; }
.kpi .lbl { font-size: 12.5px; color: var(--muted); font-weight: 500; }
.kpi .ico { width: 34px; height: 34px; border-radius: 9px; display: flex; align-items: center; justify-content: center; }
.kpi .ico svg.ic { width: 17px; height: 17px; }
.kpi .val { font-size: 21px; font-weight: 700; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
.kpi .foot { font-size: 12px; color: var(--muted); }
.ico-indigo { background: var(--primary-50); color: var(--primary); }
.ico-green { background: var(--success-50); color: var(--success); }
.ico-amber { background: var(--warning-50); color: var(--warning); }
.ico-red { background: var(--danger-50); color: var(--danger); }
.ico-blue { background: var(--info-50); color: var(--info); }
.dash-grid { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 16px; margin-top: 16px; }
.chart { display: flex; align-items: flex-end; gap: 14px; height: 200px; padding: 10px 4px 0; }
.chart .col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; height: 100%; }
.chart .bars { flex: 1; width: 100%; display: flex; align-items: flex-end; justify-content: center; gap: 4px; }
.chart .bar { width: 38%; max-width: 26px; border-radius: 5px 5px 2px 2px; min-height: 2px; transition: height .4s; }
.chart .bar.s { background: var(--primary); }
.chart .bar.c { background: #A5B4FC; }
.chart .lab { font-size: 11.5px; color: var(--muted); }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.list { list-style: none; margin: 0; padding: 0; }
.list li { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--border); }
.list li:last-child { border-bottom: 0; }
.list li.clickable { cursor: pointer; }
.list li.clickable:hover { background: #FAFBFF; }
.quick { display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- Filters ---------- */
.filters { display: flex; gap: 10px; flex-wrap: wrap; padding: 14px 16px; border-bottom: 1px solid var(--border); align-items: center; }
.filters .input-icon { flex: 1; min-width: 200px; }
.filters select, .filters input[type=date] { width: auto; min-width: 140px; }
.chips { display: flex; gap: 10px; flex-wrap: wrap; padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--surface-2); font-size: 12.5px; color: var(--muted); }
.chips b { color: var(--text); font-variant-numeric: tabular-nums; }
.chip-x { display: inline-flex; align-items: center; gap: 6px; background: var(--primary-50); color: var(--primary-600); padding: 4px 6px 4px 10px; border-radius: 999px; font-weight: 600; font-size: 12px; }
.chip-x button { border: 0; background: transparent; color: inherit; cursor: pointer; display: flex; padding: 0; }
.chip-x svg.ic { width: 14px; height: 14px; }

/* ---------- Invoice editor ---------- */
.editor-grid { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
.editor-side { position: sticky; top: 76px; display: grid; gap: 16px; }
.cust-card { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px 14px; background: var(--surface-2); font-size: 13px; }
.lines-head, .line { display: grid; grid-template-columns: minmax(140px, 2.4fr) 66px 96px 62px 62px 104px 32px; gap: 8px; align-items: start; }
.lines-head { font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 0 0 8px; border-bottom: 1px solid var(--border); }
.line { padding: 12px 0; border-bottom: 1px dashed var(--border); }
.line input { height: 36px; font-size: 13.5px; }
.line textarea { min-height: 36px; height: 36px; padding: 7px 10px; font-size: 12.5px; margin-top: 6px; }
.line .ltotal { height: 36px; display: flex; align-items: center; justify-content: flex-end; font-weight: 600; font-variant-numeric: tabular-nums; }
.line .mlabel { display: none; }
.line input.num { text-align: right; }
.totals-box .row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; gap: 10px; }
.totals-box .row .v { font-variant-numeric: tabular-nums; font-weight: 500; }
.totals-box .grand { border-top: 1px solid var(--border); margin-top: 6px; padding-top: 12px; font-size: 17px; font-weight: 700; }
.totals-box .grand .v { font-weight: 700; color: var(--primary-600); }
.totals-box .bal .v { font-weight: 700; color: var(--danger); }
.mini-row { display: grid; grid-template-columns: 1fr 120px; gap: 8px; align-items: center; margin-bottom: 8px; }
.mini-row input, .mini-row select { height: 36px; font-size: 13px; }
.tpl-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.tpl { border: 2px solid var(--border); border-radius: 10px; padding: 10px; cursor: pointer; text-align: center; font-weight: 600; font-size: 13px; background: #fff; }
.tpl.active { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-100); }
.tpl .thumb { height: 76px; border-radius: 6px; margin-bottom: 8px; border: 1px solid var(--border); background: #fff; overflow: hidden; display: flex; flex-direction: column; gap: 5px; padding: 6px; }
.tpl .thumb i { display: block; border-radius: 2px; background: #E5E7EB; height: 6px; }

/* ---------- Invoice view ---------- */
.section-title.mt-2 { margin-top: 16px; } .section-title.mt-3 { margin-top: 24px; }
.preview-wrap { overflow: hidden; position: relative; }
.preview-wrap .preview-frame { transform-origin: 0 0; }
.view-grid { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; }
.preview-frame { width: 100%; border: 0; display: block; min-height: 700px; background: #fff; border-radius: 0 0 var(--radius) var(--radius); }
.sum-row { display: flex; justify-content: space-between; padding: 7px 0; font-size: 13.5px; }
.sum-row .v { font-weight: 600; font-variant-numeric: tabular-nums; }
.timeline { list-style: none; margin: 0; padding: 0; }
.timeline li { position: relative; padding: 0 0 16px 22px; font-size: 13px; }
.timeline li::before { content: ''; position: absolute; left: 4px; top: 6px; width: 8px; height: 8px; border-radius: 50%; background: var(--primary); box-shadow: 0 0 0 3px var(--primary-50); }
.timeline li::after { content: ''; position: absolute; left: 7.5px; top: 18px; bottom: 0; width: 1px; background: var(--border); }
.timeline li:last-child::after { display: none; }
.timeline .when { font-size: 11.5px; color: var(--muted); }
.pay-item { display: flex; align-items: flex-start; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); }
.pay-item:last-child { border-bottom: 0; }

/* ---------- Modal ---------- */
.modal-backdrop { position: fixed; inset: 0; background: rgba(15, 23, 42, .5); z-index: 1000; display: flex; align-items: flex-start; justify-content: center; padding: 6vh 16px 16px; overflow-y: auto; animation: fade .15s ease; }
.modal { background: var(--surface); border-radius: 16px; box-shadow: var(--shadow-lg); width: 100%; max-width: 520px; animation: pop .18s ease; display: flex; flex-direction: column; max-height: 88vh; }
.modal.lg { max-width: 760px; }
.modal.sm { max-width: 420px; }
.modal-head { display: flex; align-items: center; justify-content: space-between; padding: 18px 22px; border-bottom: 1px solid var(--border); }
.modal-body { padding: 22px; overflow-y: auto; }
.modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 22px; border-top: 1px solid var(--border); background: var(--surface-2); border-radius: 0 0 16px 16px; flex-wrap: wrap; }
@keyframes fade { from { opacity: 0; } }
@keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.98); } }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin: -6px 0 18px; overflow-x: auto; }
.tab { border: 0; background: transparent; padding: 10px 14px; font: 600 13px var(--font); color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tab.active { color: var(--primary); border-bottom-color: var(--primary); }
.logo-drop { display: flex; align-items: center; gap: 18px; padding: 18px; border: 2px dashed var(--border-2); border-radius: 12px; }
.logo-drop .prev { width: 96px; height: 96px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface-2) center/contain no-repeat; display: flex; align-items: center; justify-content: center; color: var(--muted); flex-shrink: 0; }

/* ---------- Toasts ---------- */
.toast-root { position: fixed; top: 16px; right: 16px; z-index: 2000; display: flex; flex-direction: column; gap: 10px; max-width: 380px; width: calc(100% - 32px); pointer-events: none; }
.toast { pointer-events: auto; display: flex; align-items: flex-start; gap: 10px; padding: 13px 14px; border-radius: 10px; background: #0F172A; color: #fff; box-shadow: var(--shadow-lg); font-size: 13.5px; animation: pop .2s ease; border-left: 4px solid #6366F1; }
.toast.success { border-left-color: #22C55E; }
.toast.error { border-left-color: #EF4444; }
.toast.info { border-left-color: #38BDF8; }
.toast .t-msg { flex: 1; }
.toast button { background: transparent; border: 0; color: #94A3B8; cursor: pointer; padding: 0; display: flex; }
.toast svg.ic { width: 16px; height: 16px; }
.toast .t-act { color: #fff; font-weight: 700; font-size: 12.5px; padding: 3px 10px; border: 1px solid #475569; border-radius: 6px; align-self: center; }
.toast .t-act:hover { background: #1E293B; }
/* switches (Update 5) */
.sw-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 4px 22px; }
.sw { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 13.5px; cursor: pointer; user-select: none; }
.sw input { position: absolute; opacity: 0; width: 0; height: 0; }
.sw .knob { flex: 0 0 auto; position: relative; width: 38px; height: 22px; border-radius: 999px; background: #CBD5E1; transition: background .15s; }
.sw .knob::after { content: ''; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .15s; }
.sw input:checked + .knob { background: var(--primary); }
.sw input:checked + .knob::after { transform: translateX(16px); }
.sw input:focus-visible + .knob { outline: 2px solid var(--primary); outline-offset: 2px; }
.sw-group { margin-bottom: 18px; }
.sw-group h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin: 0 0 4px; }

/* ---------- Responsive ---------- */
@media (max-width: 1180px) {
  .kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .editor-grid, .view-grid { grid-template-columns: minmax(0, 1fr); }
  .editor-side { position: static; }
}
@media (max-width: 960px) {
  .sidebar { position: fixed; left: 0; top: 0; bottom: 0; transform: translateX(-100%); transition: transform .22s ease; }
  .app.nav-open .sidebar { transform: translateX(0); box-shadow: var(--shadow-lg); }
  .app.nav-open .sidebar-backdrop { display: block; position: fixed; inset: 0; background: rgba(15, 23, 42, .45); z-index: 250; }
  .menu-btn { display: inline-flex; }
  .dash-grid { grid-template-columns: minmax(0, 1fr); }
  .auth-view { grid-template-columns: 1fr; }
  .auth-hero { display: none; }
}
@media (max-width: 760px) {
  .page { padding: 16px; }
  .topbar { padding: 0 14px; }
  .form-grid, .form-grid.g3 { grid-template-columns: minmax(0, 1fr); }
  .hide-sm { display: none !important; }
  .lines-head { display: none; }
  .line { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; padding: 14px; border: 1px solid var(--border); border-radius: 10px; margin-bottom: 10px; background: var(--surface-2); }
  .line .c-name { grid-column: 1 / -1; }
  .line .c-total { grid-column: 1 / 2; }
  .line .c-del { grid-column: 2 / 3; justify-self: end; }
  .line .mlabel { display: block; font-size: 11px; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
  .line .ltotal { justify-content: flex-start; }
  .biz-top { padding: 14px 16px; }
  .modal-backdrop { padding: 0; align-items: flex-end; }
  .modal { max-height: 92vh; border-radius: 16px 16px 0 0; }
  .modal-foot { border-radius: 0; }
  .tpl-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .table th, .table td { padding: 10px 12px; }
  .kpi .val { font-size: 18px; }
}
@media (max-width: 420px) {
  .kpi-grid { grid-template-columns: minmax(0, 1fr); }
}
@media print {
  .sidebar, .topbar, .toast-root { display: none !important; }
}

/* ---------- Update 6: expenses, inventory, reports ---------- */
.show-sm { display: none; }
.rbar { height: 6px; border-radius: 4px; background: var(--surface-2); overflow: hidden; margin: 3px 0; }
.rbar span { display: block; height: 100%; border-radius: 4px; min-width: 2px; }
.rp-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.rp-grid > .card { margin-top: 0; }
.kpi-grid + .card, .kpi-grid + .chips { margin-top: 16px; }
@media (max-width: 1100px) { .rp-grid { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 760px) { .show-sm { display: block; } }

/* ---------- Dark mode ---------- */
.theme-fab { position: fixed; top: 14px; right: 14px; z-index: 50; background: var(--surface); }
.auth-view.hidden + .theme-fab { display: none; }
html[data-theme="dark"] { color-scheme: dark; }
html[data-theme="dark"] {
  --bg: #0B1120;
  --surface: #111A2E;
  --surface-2: #0F172A;
  --text: #E2E8F0;
  --text-2: #CBD5E1;
  --muted: #94A3B8;
  --border: #1F2A40;
  --border-2: #2C3A55;
  --primary: #6366F1;
  --primary-600: #4F46E5;
  --primary-50: rgba(99, 102, 241, .16);
  --primary-100: rgba(99, 102, 241, .26);
  --success: #4ADE80;
  --success-50: rgba(34, 197, 94, .14);
  --warning: #FBBF24;
  --warning-50: rgba(245, 158, 11, .14);
  --danger: #F87171;
  --danger-50: rgba(239, 68, 68, .14);
  --info: #38BDF8;
  --info-50: rgba(14, 165, 233, .14);
  --sidebar: #070C18;
  --sidebar-2: #111A2E;
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, .4);
  --shadow: 0 1px 3px rgba(0, 0, 0, .45), 0 4px 16px rgba(0, 0, 0, .25);
  --shadow-lg: 0 20px 50px rgba(0, 0, 0, .6);
}
html[data-theme="dark"] input, html[data-theme="dark"] select, html[data-theme="dark"] textarea,
html[data-theme="dark"] input[type=color] { background: #0B1324; color: var(--text); border-color: var(--border-2); }
html[data-theme="dark"] input::placeholder, html[data-theme="dark"] textarea::placeholder { color: #64748B; }
html[data-theme="dark"] .seg button.active { background: var(--surface); color: #A5B4FC; }
html[data-theme="dark"] .btn-primary { color: #fff; }
html[data-theme="dark"] .badge-pending, html[data-theme="dark"] .chip-x, html[data-theme="dark"] .totals-box .grand .v { color: #A5B4FC; }
html[data-theme="dark"] a { color: #A5B4FC; }
html[data-theme="dark"] .btn-success, html[data-theme="dark"] .btn-danger { color: #0B1120; }
html[data-theme="dark"] .badge-cancelled, html[data-theme="dark"] .badge-voided { background: rgba(148, 163, 184, .14); color: #94A3B8; }
html[data-theme="dark"] .badge-converted { background: rgba(139, 92, 246, .18); color: #C4B5FD; }
html[data-theme="dark"] .table tbody tr.clickable:hover td, html[data-theme="dark"] .list li.clickable:hover { background: #16213A; }
html[data-theme="dark"] .loader { background: rgba(11, 17, 32, .55); }
html[data-theme="dark"] .alert-error { color: #FECACA; }
html[data-theme="dark"] .alert-info { color: #BAE6FD; }
html[data-theme="dark"] .alert-warn { color: #FDE68A; }
html[data-theme="dark"] .btn-soft-danger:hover { border-color: rgba(239, 68, 68, .4); }
html[data-theme="dark"] .tpl { background: var(--surface-2); color: var(--text); }
html[data-theme="dark"] .sw .knob { background: #334155; }
html[data-theme="dark"] .toast { background: #1E293B; border: 1px solid #334155; }
html[data-theme="dark"] .modal-backdrop { background: rgba(0, 0, 0, .65); }
html[data-theme="dark"] .rbar { background: #1A2540; }
html[data-theme="dark"] input[type=date]::-webkit-calendar-picker-indicator { filter: invert(.8); }
</style>

<body>

  <!-- Boot screen -->
  <div id="boot" class="boot">
    <div class="spinner"></div>

  <!-- Business selection -->

function icon(name, cls) {
  return '<svg class="ic ' + (cls || '') + '" viewBox="0 0 24 24" aria-hidden="true">' + (ICONS[name] || '') + '</svg>';
}
function hydrateIcons(root) {
  (root || document).querySelectorAll('[data-icon]').forEach(function (el) {
    if (!el.dataset.iconDone) { el.innerHTML = icon(el.dataset.icon); el.dataset.iconDone = '1'; }
  });
}

/* ---------------- Formatting ---------------- */
const TZ = 'Asia/Colombo';
function esc(s) {
  return String(s === null || s === undefined ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function nl2br(s) { return esc(s).replace(/\n/g, '<br>'); }
function round2(n) { const x = Number(n); return isFinite(x) ? Math.round((x + Number.EPSILON) * 100) / 100 : 0; }
function num(n) {
  const p = round2(n).toFixed(2).split('.');
  p[0] = p[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return p.join('.');
}
function cnt(n) { return String(Math.round(Number(n) || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
function money(n) {
  const cur = (App.state.business && App.state.business.Currency) || 'LKR';
  return (cur === 'LKR' ? 'Rs.' : cur) + ' ' + num(n);
}
function todayStr() {
  return new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
}
function addDays(dateStr, days) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(dateStr || '');
  if (!m) return '';
  const d = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3] + Number(days || 0)));
  return d.toISOString().slice(0, 10);
}
function fmtDate(s) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || '');
  return m ? m[3] + '/' + m[2] + '/' + m[1] : '';
}
function fmtDateTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d)) return '';
  const p = new Intl.DateTimeFormat('en-GB', { timeZone: TZ, day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false }).format(d);
  return p.replace(',', '');
}
function monthStart() { return todayStr().slice(0, 8) + '01'; }
function initials(name) {
  const p = String(name || '?').trim().split(/\s+/);
  return ((p[0] || '?')[0] + (p[1] ? p[1][0] : '')).toUpperCase();
}
function debounce(fn, ms) {
  let t; return function () { const a = arguments; clearTimeout(t); t = setTimeout(function () { fn.apply(null, a); }, ms || 250); };
}
function statusBadge(status, overdue) {
  if (overdue && status !== 'Paid' && status !== 'Cancelled') return '<span class="badge badge-overdue">Overdue</span>';
  const cls = { 'Paid': 'paid', 'Partially Paid': 'partial', 'Pending': 'pending', 'Cancelled': 'cancelled',
    'Open': 'pending', 'Accepted': 'paid', 'Declined': 'overdue', 'Expired': 'cancelled', 'Converted': 'converted',
    'In stock': 'paid', 'Low stock': 'pending', 'Out of stock': 'overdue', 'Not tracked': 'cancelled' }[status] || 'pending';
  return '<span class="badge badge-' + cls + '">' + esc(status) + '</span>';
}
/** Update 6: download rows (array of arrays) as a CSV file (Excel friendly). */
function downloadCsv(filename, rows) {
  const q = function (v) {
    v = v === null || v === undefined ? '' : String(v);
    return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
  };
  const text = '\ufeff' + rows.map(function (r) { return r.map(q).join(','); }).join('\r\n');
  const url = URL.createObjectURL(new Blob([text], { type: 'text/csv;charset=utf-8' }));
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 500);
}
function waNumber(phone) {
  let d = String(phone || '').replace(/\D/g, '');
  if (d.length === 10 && d[0] === '0') d = '94' + d.slice(1);
  else if (d.length === 9 && d[0] === '7') d = '94' + d;
  else if (d.indexOf('00') === 0) d = d.slice(2);
  return d;
}

/* ---------------- Safe storage ---------------- */
const Store = {
  get: function (k) { try { return sessionStorage.getItem(k) || localStorage.getItem(k); } catch (e) { return null; } },
  set: function (k, v, persist) {
    try { (persist ? localStorage : sessionStorage).setItem(k, v); } catch (e) { /* storage blocked */ }
  },
  remove: function (k) { try { sessionStorage.removeItem(k); localStorage.removeItem(k); } catch (e) { } }
};

/* ---------------- API bridge ---------------- */
/* ---------- Dark mode ----------
   Saved per device in localStorage ('dacaTheme' = 'light' | 'dark').
   Nothing saved -> follows the phone / computer setting. */
const Theme = {
  KEY: 'dacaTheme',
  saved: function () { try { return localStorage.getItem(Theme.KEY); } catch (e) { return null; } },
  isDark: function () { return document.documentElement.getAttribute('data-theme') === 'dark'; },
  apply: function (mode) {
    const dark = mode === 'dark' || (!mode && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    Theme.paint();
  },
  set: function (mode) {
    try { if (mode) localStorage.setItem(Theme.KEY, mode); else localStorage.removeItem(Theme.KEY); } catch (e) {}
    Theme.apply(mode);
  },
  toggle: function () { Theme.set(Theme.isDark() ? 'light' : 'dark'); },
  /** Updates every theme button (icon + label). */
  paint: function () {
    const dark = Theme.isDark();
    document.querySelectorAll('[data-theme-toggle]').forEach(function (b) {
      const lbl = b.getAttribute('data-theme-toggle') === 'label';
      b.innerHTML = icon(dark ? 'sun' : 'moon') + (lbl ? ' ' + (dark ? 'Light mode' : 'Dark mode') : '');
      b.title = dark ? 'Switch to light mode' : 'Switch to dark mode';
    });
  },
  init: function () {
    Theme.apply(Theme.saved());
    document.addEventListener('click', function (e) {
      if (e.target.closest('[data-theme-toggle]')) Theme.toggle();
    });
    if (window.matchMedia) {
      const mq = window.matchMedia('(prefers-color-scheme: dark)');
      const onChange = function () { if (!Theme.saved()) Theme.apply(null); };
      if (mq.addEventListener) mq.addEventListener('change', onChange); else if (mq.addListener) mq.addListener(onChange);
    }
  }
};

const API = {
  call: function (action, payload, opts) {
    opts = opts || {};
    return new Promise(function (resolve, reject) {
      if (!opts.silent) UI.loading(true);
      const p = Object.assign({}, payload || {});
      if (App.state.business && !p.businessId) p.businessId = App.state.business.BusinessId;
      const onRes = function (res) {
        if (!opts.silent) UI.loading(false);
        if (!res) return reject(new Error('No response from the server. Please try again.'));
        if (res.ok) return resolve(res.data);
        const err = new Error(res.error || 'Request failed.');
        err.code = res.code;
        if (res.code === 'AUTH' && action !== 'auth.login') Auth.expire();
        reject(err);
      };
      // Hosted outside Apps Script (e.g. Vercel): call the Apps Script web app over HTTPS.
      if (window.DACA_API_URL || typeof google === 'undefined' || !google.script) {
        if (!window.DACA_API_URL) { if (!opts.silent) UI.loading(false); return reject(new Error('API URL is not set (config.js).')); }
        fetch(window.DACA_API_URL, {
          method: 'POST', redirect: 'follow',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: action, token: App.state.token, payload: p })
        }).then(function (r) { return r.text(); }).then(function (t) {
          let res = null;
          try { res = JSON.parse(t); } catch (e) {
            if (!opts.silent) UI.loading(false);
            return reject(new Error('The server did not return data. Check that the Apps Script deployment has access "Anyone" and a new version is deployed.'));
          }
          onRes(res);
        }).catch(function (e) {
          if (!opts.silent) UI.loading(false);
          reject(new Error('Connection problem. Please check your internet and try again.' + (e && e.message ? ' (' + e.message + ')' : '')));
        });
        return;
      }
      google.script.run
        .withSuccessHandler(function (res) {
          if (!opts.silent) UI.loading(false);
          if (!res) return reject(new Error('No response from the server. Please try again.'));
          if (res.ok) return resolve(res.data);
          const err = new Error(res.error || 'Request failed.');
          err.code = res.code;
          if (res.code === 'AUTH' && action !== 'auth.login') Auth.expire();
          reject(err);
        })
        .withFailureHandler(function (e) {
          if (!opts.silent) UI.loading(false);
          reject(new Error('Connection problem. Please check your internet and try again.' +
            (e && e.message ? ' (' + e.message + ')' : '')));
        })
        .api(action, App.state.token, p);
    });
  }
};

/* ---------------- UI helpers ---------------- */
const UI = {
  _loading: 0, _loaderTimer: null,

  loading: function (on) {
    UI._loading = Math.max(0, UI._loading + (on ? 1 : -1));
    const el = document.getElementById('loader');
    clearTimeout(UI._loaderTimer);
    if (UI._loading > 0) {
      UI._loaderTimer = setTimeout(function () { if (UI._loading > 0) el.classList.remove('hidden'); }, 180);
    } else {
      el.classList.add('hidden');
    }
  },

  /**
   * toast(msg, type, ms, action) - action = { label, onClick } adds a button
   * (e.g. "Undo") to the message.
   */
  toast: function (msg, type, ms, action) {
    type = type || 'success';
    const root = document.getElementById('toast-root');
    const el = document.createElement('div');
    el.className = 'toast ' + type;
    el.innerHTML = icon(type === 'error' ? 'alert' : type === 'info' ? 'info' : 'check') +
      '<div class="t-msg">' + esc(msg) + '</div>' +
      (action ? '<button class="t-act">' + esc(action.label) + '</button>' : '') +
      '<button class="t-x" aria-label="Close">' + icon('x') + '</button>';
    root.appendChild(el);
    const close = function () { if (el.parentNode) el.parentNode.removeChild(el); };
    el.querySelector('.t-x').onclick = close;
    if (action) {
      el.querySelector('.t-act').onclick = async function () {
        close();
        try { await action.onClick(); } catch (e) { UI.error(e); }
      };
    }
    setTimeout(close, ms || (action ? 9000 : type === 'error' ? 6500 : 3500));
  },

  error: function (e) {
    if (e && e.code === 'AUTH') return;
    UI.toast((e && e.message) || String(e), 'error');
  },

  /**
   * opts: { title, body (html), size: 'sm'|'lg', buttons: [{label, cls, onClick(m), close}], onClose, static }
   * returns { el, close, body }
   */
  modal: function (opts) {
    const root = document.getElementById('modal-root');
    const back = document.createElement('div');
    back.className = 'modal-backdrop';
    back.innerHTML =
      '<div class="modal ' + (opts.size || '') + '" role="dialog" aria-modal="true">' +
        '<div class="modal-head"><h2>' + esc(opts.title || '') + '</h2>' +
        '<button class="btn btn-ghost btn-icon" data-close aria-label="Close">' + icon('x') + '</button></div>' +
        '<div class="modal-body">' + (opts.body || '') + '</div>' +
        (opts.buttons && opts.buttons.length ? '<div class="modal-foot"></div>' : '') +
      '</div>';
    root.appendChild(back);
    hydrateIcons(back);

    const m = {
      el: back,
      body: back.querySelector('.modal-body'),
      close: function () {
        if (!back.parentNode) return;
        back.parentNode.removeChild(back);
        document.removeEventListener('keydown', onKey);
        if (opts.onClose) opts.onClose();
      }
    };
    const onKey = function (e) { if (e.key === 'Escape' && root.lastElementChild === back) m.close(); };
    document.addEventListener('keydown', onKey);
    back.querySelector('[data-close]').onclick = m.close;
    back.addEventListener('mousedown', function (e) { if (e.target === back && !opts.static) m.close(); });

    const foot = back.querySelector('.modal-foot');
    (opts.buttons || []).forEach(function (b) {
      const btn = document.createElement('button');
      btn.className = 'btn ' + (b.cls || '');
      btn.innerHTML = (b.icon ? icon(b.icon) : '') + esc(b.label);
      btn.onclick = async function () {
        if (b.close) return m.close();
        if (!b.onClick) return;
        btn.disabled = true;
        try { await b.onClick(m); } catch (e) { UI.error(e); } finally { btn.disabled = false; }
      };
      foot.appendChild(btn);
    });
    const first = back.querySelector('.modal-body input:not([type=hidden]):not([readonly]), .modal-body select, .modal-body textarea');
    if (first && !opts.noFocus) setTimeout(function () { first.focus(); }, 60);
    return m;
  },

  confirm: function (o) {
    return new Promise(function (resolve) {
      let done = false;
      const m = UI.modal({
        title: o.title || 'Please confirm', size: 'sm', noFocus: true,
        body: '<p style="margin:0">' + (o.html || esc(o.message || 'Are you sure?')) + '</p>',
        onClose: function () { if (!done) resolve(false); },
        buttons: [
          { label: o.cancelText || 'Cancel', close: true },
          { label: o.confirmText || 'Confirm', cls: o.danger ? 'btn-danger' : 'btn-primary', onClick: function (mm) { done = true; resolve(true); mm.close(); } }
        ]
      });
    });
  },

  /** Asks for text (e.g. a reason). Resolves to the text or null. */
  prompt: function (o) {
    return new Promise(function (resolve) {
      let done = false;
      const m = UI.modal({
        title: o.title, size: 'sm',
        body: (o.message ? '<p style="margin:0 0 14px">' + o.message + '</p>' : '') +
          '<div class="field"><label>' + esc(o.label || '') + '</label>' +
          (o.multiline ? '<textarea id="ui-prompt" maxlength="300" placeholder="' + esc(o.placeholder || '') + '"></textarea>'
                       : '<input type="text" id="ui-prompt" maxlength="200" placeholder="' + esc(o.placeholder || '') + '">') + '</div>',
        onClose: function () { if (!done) resolve(null); },
        buttons: [
          { label: 'Cancel', close: true },
          { label: o.confirmText || 'OK', cls: o.danger ? 'btn-danger' : 'btn-primary', onClick: function (mm) {
            const v = mm.el.querySelector('#ui-prompt').value.trim();
            if (o.required !== false && !v) { UI.toast((o.label || 'This field') + ' is required.', 'error'); return; }
            if (o.match && v !== o.match) { UI.toast('The text does not match.', 'error'); return; }
            done = true; resolve(v); mm.close();
          } }
        ]
      });
    });
  },

  /** Reads named inputs inside a container into an object. */
  formData: function (root) {
    const out = {};
    root.querySelectorAll('[name]').forEach(function (el) {
      if (el.type === 'checkbox') out[el.name] = el.checked;
      else if (el.type === 'radio') { if (el.checked) out[el.name] = el.value; }
      else out[el.name] = el.value;
    });
    return out;
  },

  empty: function (ic, title, text, actionHtml) {
    return '<div class="empty"><div class="empty-ic">' + icon(ic) + '</div><h3>' + esc(title) + '</h3><p>' + esc(text) + '</p>' + (actionHtml || '') + '</div>';
  },

  /** Downloads a base64 file. Returns true if the browser allowed it. */
  downloadBase64: function (base64, fileName, mime) {
    try {
      const bin = atob(base64);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      const url = URL.createObjectURL(new Blob([bytes], { type: mime || 'application/pdf' }));
      const a = document.createElement('a');
      a.href = url; a.download = fileName; a.target = '_blank';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
      return url;
    } catch (e) { return null; }
  },

  /** Prints an HTML document via a new window (falls back to a hidden frame). */
  printHtml: function (html) {
    const w = window.open('', '_blank');
    if (w && w.document) {
      w.document.open();
      w.document.write(html.replace('</body>', '<script>window.onload=function(){setTimeout(function(){window.print();},300);};<\/script></body>'));
      w.document.close();
      return;
    }
    const f = document.createElement('iframe');
    f.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0';
    document.body.appendChild(f);
    f.srcdoc = html;
    f.onload = function () {
      try { f.contentWindow.focus(); f.contentWindow.print(); } catch (e) { UI.toast('Printing was blocked by the browser. Use Download PDF instead.', 'error'); }
      setTimeout(function () { f.remove(); }, 4000);
    };
  }
};

/* ---------------- App & router ---------------- */
const App = {
  state: { token: null, user: null, business: null, settings: null, lists: null },
  pages: {},
  current: null,
  cache: {},

  NAV: [
    { label: 'Main' },
    { id: 'dashboard', label: 'Dashboard', icon: 'dashboard' },

    { label: 'Records' },
    { id: 'customers', label: 'Customers', icon: 'users' },
    { id: 'services', label: 'Products & Services', icon: 'box' },
    { id: 'inventory', label: 'Inventory', icon: 'layers' },
    { label: 'Settings' },
    { id: 'settings', label: 'Business Settings', icon: 'settings' },
    { id: 'account', label: 'My Account', icon: 'user' }
  ],

  boot: async function () {
    hydrateIcons(document);
    Theme.init();
    App.state.token = Store.get('dacaToken');
    try {
      const status = await API.call('auth.status', {}, { silent: true });
      document.getElementById('boot').classList.add('hidden');
      if (!status.setupComplete) return Auth.renderNotSetup();
      if (status.needsOwner) return Auth.renderSetup();

      } catch (e) {
        return Auth.renderLogin();
      }
      const lastBiz = Store.get('dacaBiz');
      if (lastBiz) {

      Biz.showSelector();
    } catch (e) {
      document.getElementById('boot').innerHTML =
        '<div class="alert alert-error" style="max-width:420px">' + icon('alert') + '<div>' + esc(e.message) + '</div></div>' +
        '<button class="btn" onclick="location.reload()">' + icon('refresh') + ' Retry</button>';
    }
  },

  show: function (view) {
    ['auth-view', 'biz-view', 'app-view'].forEach(function (id) {
      document.getElementById(id).classList.toggle('hidden', id !== view);
    });
    document.getElementById('boot').classList.add('hidden');
  },

  /** Builds the sidebar for the open business. */
  renderShell: function () {
    const b = App.state.business, u = App.state.user;
    document.getElementById('sb-biz').innerHTML =
      '<div class="logo">' + (b.logoDataUrl ? '<img src="' + b.logoDataUrl + '" alt="">' : esc(initials(b.BusinessName))) + '</div>' +
      '<div class="grow"><div class="name ellipsis">' + esc(b.BusinessName) + '</div><div class="sub">Switch business</div></div>' + icon('switch');
    document.getElementById('sb-user').innerHTML =
      '<div class="avatar">' + esc(initials(u.displayName)) + '</div><div class="grow"><div class="ellipsis" style="color:#fff;font-weight:600;font-size:13px">' +
      esc(u.displayName) + '</div><div class="small" style="color:#94A3B8">' + esc(u.username) + '</div></div>';

    document.getElementById('sb-nav').innerHTML = App.NAV.map(function (n) {
      if (!n.id && !n.soon) return '<div class="sb-label">' + esc(n.label) + '</div>';
      if (n.soon) return '<div class="nav-item disabled" title="Planned module">' + icon(n.icon) + esc(n.label) + '<span class="badge badge-soon">Soon</span></div>';
      return '<button class="nav-item" data-page="' + n.id + '">' + icon(n.icon) + esc(n.label) + '</button>';
    }).join('');
    if (App.current) {
      const def = App.pages[App.current] || {};
      document.querySelectorAll('#sb-nav [data-page]').forEach(function (btn) {
        btn.classList.toggle('active', btn.dataset.page === (def.nav || App.current));
      });
    }

    if (!App._shellBound) {
      App._shellBound = true;
      document.getElementById('sb-nav').addEventListener('click', function (e) {
        const btn = e.target.closest('[data-page]');
        if (btn) App.go(btn.dataset.page);
      });
      document.getElementById('sb-biz').onclick = function () { Biz.showSelector(); };
      document.querySelector('[data-action="switch-business"]').onclick = function () { Biz.showSelector(); };
      document.querySelector('[data-action="logout"]').onclick = function () { Auth.logout(); };
      document.getElementById('menu-btn').onclick = function () { document.getElementById('app-view').classList.add('nav-open'); };
      document.getElementById('sidebar-backdrop').onclick = function () { document.getElementById('app-view').classList.remove('nav-open'); };
      document.getElementById('topbar-new').onclick = function () { App.go('invoice-new'); };
    }
  },

  go: async function (page, params) {
    const def = App.pages[page];
    if (!def) return;
    App.current = page;
    document.getElementById('app-view').classList.remove('nav-open');
    document.querySelectorAll('#sb-nav [data-page]').forEach(function (b) {
      b.classList.toggle('active', b.dataset.page === (def.nav || page));
    });
    document.getElementById('topbar-title').textContent = def.title || '';
    const el = document.getElementById('page');
    el.onclick = null; el.oninput = null; el.onchange = null;
    el.innerHTML = '<div class="empty"><div class="spinner" style="margin:0 auto"></div></div>';
    window.scrollTo(0, 0);
    try {
      await def.render(el, params || {});
      hydrateIcons(el);
    } catch (e) {
      if (e && e.code === 'AUTH') return;
      el.innerHTML = '<div class="card card-pad"><div class="alert alert-error">' + icon('alert') + '<div>' + esc(e.message) +
        '</div></div><button class="btn mt-2" id="retry">' + icon('refresh') + ' Try again</button></div>';
      el.querySelector('#retry').onclick = function () { App.go(page, params); };
    }
  },

  /** Cached lookups for the open business (customers, items). */
  getCustomers: async function (force) {
    if (!App.cache.customers || force) App.cache.customers = await API.call('customers.list', {}, { silent: true });
    return App.cache.customers;
  },
  getServices: async function (force) {
    if (!App.cache.services || force) App.cache.services = await API.call('services.list', {}, { silent: true });
    return App.cache.services;
  },
  invalidate: function (key) { if (key) delete App.cache[key]; else App.cache = {}; }
};

  <script>
/* ============================================================
   DacaBilling - JS_Auth.html
   First-time owner setup, login, logout, session expiry,
   account page (profile + change password).
   ============================================================ */
const Auth = {
  _expiring: false,

  heroHtml: function () {
    return '<section class="auth-hero">' +
      '<div class="brand" style="color:#fff"><span class="brand-mark">' + icon('receipt') + '</span> DacaBilling</div>' +
      '<div><h1>Billing for every business you run.</h1>' +

      '</ul></div>' +
      '<div class="small" style="color:#818CF8">Secure sign-in &middot; Sessions expire automatically</div>' +

  pwField: function (name, label, auto) {

      '<input type="password" name="' + name + '" autocomplete="' + (auto || 'current-password') + '" maxlength="128" required>' +

      b.onclick = function () {
        const inp = b.parentNode.querySelector('input');
        const show = inp.type === 'password';
        inp.type = show ? 'text' : 'password';
        b.innerHTML = icon(show ? 'eyeoff' : 'eye');

  renderNotSetup: function () {
    const v = document.getElementById('auth-view');

      '<h2>Setup required</h2><p class="sub">The database has not been prepared yet.</p>' +
      '<div class="alert alert-warn">' + icon('alert') + '<div>Open the Apps Script editor, run <b>setupDacaBilling</b>, then reload this page.</div></div>' +
      '<button class="btn btn-block mt-2" onclick="location.reload()">' + icon('refresh') + ' Reload</button></div></section>';
    App.show('auth-view');

  renderSetup: function () {
    const v = document.getElementById('auth-view');
    v.innerHTML = Auth.heroHtml() + '<section class="auth-panel"><div class="auth-card">' +
      '<h2>Create owner account</h2><p class="sub">This is a one-time step. This account will manage all your businesses.</p>' +
      '<form id="setup-form" autocomplete="off">' +
        '<div class="field"><label>Your name</label><input type="text" name="displayName" maxlength="80" required></div>' +
        '<div class="field"><label>Username</label><input type="text" name="username" maxlength="30" autocomplete="username" required>' +
          '<span class="hint">3-30 characters: letters, numbers, dot, dash or underscore.</span></div>' +
        '<div class="field"><label>Email (optional)</label><input type="email" name="email" maxlength="254"></div>' +
        Auth.pwField('password', 'Password', 'new-password') +
        Auth.pwField('confirmPassword', 'Confirm password', 'new-password') +
        '<span class="small muted" style="margin-top:-6px">At least 8 characters with a letter and a number.</span>' +
        '<div id="setup-err"></div>' +
        '<button class="btn btn-primary btn-lg btn-block" type="submit">Create account</button>' +
      '</form></div></section>';
    App.show('auth-view');
    Auth.bindPwToggles(v);
    v.querySelector('#setup-form').onsubmit = async function (e) {
      e.preventDefault();
      const d = UI.formData(e.target);
      const errBox = v.querySelector('#setup-err');
      errBox.innerHTML = '';
      if (d.password !== d.confirmPassword) {
        errBox.innerHTML = '<div class="alert alert-error">' + icon('alert') + '<div>Passwords do not match.</div></div>';
        return;
      }
      try {
        const res = await API.call('auth.setupOwner', d);
        Auth.onSignedIn(res, false);
        UI.toast('Welcome to DacaBilling, ' + res.user.displayName + '.');
      } catch (err) {
        errBox.innerHTML = '<div class="alert alert-error">' + icon('alert') + '<div>' + esc(err.message) + '</div></div>';
      }

  renderLogin: function (notice) {
    App.state.token = null;
    const v = document.getElementById('auth-view');
    v.innerHTML = Auth.heroHtml() + '<section class="auth-panel"><div class="auth-card">' +
      '<h2>Sign in</h2><p class="sub">Welcome back. Sign in to manage your businesses.</p>' +
      (notice ? '<div class="alert alert-info" style="margin-bottom:16px">' + icon('info') + '<div>' + esc(notice) + '</div></div>' : '') +
      '<form id="login-form">' +
        '<div class="field"><label>Username</label><input type="text" name="username" autocomplete="username" maxlength="60" required></div>' +
        Auth.pwField('password', 'Password') +
        '<label class="check"><input type="checkbox" name="remember"> Keep me signed in on this device</label>' +
        '<div id="login-err"></div>' +
        '<button class="btn btn-primary btn-lg btn-block" type="submit">Sign in</button>' +
      '</form></div></section>';
    App.show('auth-view');
    Auth.bindPwToggles(v);
    setTimeout(function () { const u = v.querySelector('[name=username]'); if (u) u.focus(); }, 50);
    v.querySelector('#login-form').onsubmit = async function (e) {
      e.preventDefault();
      const d = UI.formData(e.target);
      const errBox = v.querySelector('#login-err');
      errBox.innerHTML = '';
      const btn = e.target.querySelector('button[type=submit]');
      btn.disabled = true;
      try {
        const res = await API.call('auth.login', { username: d.username, password: d.password });
        Auth.onSignedIn(res, d.remember);
      } catch (err) {
        errBox.innerHTML = '<div class="alert alert-error">' + icon('alert') + '<div>' + esc(err.message) + '</div></div>';
        e.target.querySelector('[name=password]').value = '';
      } finally {
        btn.disabled = false;
      }
    };
  },

  onSignedIn: function (res, remember) {
    Auth._expiring = false;
    App.state.token = res.token;
    App.state.user = res.user;
    Store.remove('dacaToken');
    Store.set('dacaToken', res.token, !!remember);
    Biz.showSelector();
  },

  clearLocal: function () {
    Store.remove('dacaToken');
    Store.remove('dacaBiz');
    App.state = { token: null, user: null, business: null, settings: null, lists: null };
    App.invalidate();
    document.getElementById('modal-root').innerHTML = '';
  },

  logout: async function () {
    const ok = await UI.confirm({ title: 'Sign out', message: 'Do you want to sign out of DacaBilling?', confirmText: 'Sign out' });
    if (!ok) return;
    try { await API.call('auth.logout'); } catch (e) { /* ignore */ }
    Auth.clearLocal();
    Auth.renderLogin('You have been signed out.');
  },

  /** Called when the server says the session is no longer valid. */
  expire: function () {
    if (Auth._expiring) return;
    Auth._expiring = true;
    Auth.clearLocal();
    Auth.renderLogin('Your session has expired. Please sign in again.');
  }
};

  showSelector: async function () {

    App.state.settings = res.settings;

  /** Create / edit modal with tabs and logo upload. */
  openForm: function (b, onSaved) {
    const isNew = !b;
    b = b || { InvoicePrefix: 'INV', Currency: 'LKR' };
    let pendingLogo = null;
    const currencies = (App.state.lists && App.state.lists.currencies) || ['LKR', 'USD', 'EUR', 'GBP', 'INR', 'AUD', 'SGD', 'AED'];

    const body =
      '<div class="tabs"><button class="tab active" data-tab="profile">Profile</button><button class="tab" data-tab="invoice">Invoice &amp; payment</button><button class="tab" data-tab="logo">Logo</button></div>' +
      '<div data-pane="profile" class="form-grid">' +
        '<div class="field full"><label>Business name <span class="req">*</span></label><input type="text" name="BusinessName" maxlength="120" value="' + esc(b.BusinessName) + '"></div>' +
        '<div class="field"><label>Contact number <span class="req">*</span></label><input type="tel" name="Phone" maxlength="25" value="' + esc(b.Phone) + '" placeholder="0771234567"></div>' +
        '<div class="field"><label>WhatsApp number</label><input type="tel" name="WhatsApp" maxlength="25" value="' + esc(b.WhatsApp) + '"></div>' +
        '<div class="field"><label>Email address</label><input type="email" name="Email" maxlength="254" value="' + esc(b.Email) + '"></div>' +
        '<div class="field"><label>Website / social media</label><input type="text" name="Website" maxlength="200" value="' + esc(b.Website) + '" placeholder="www.example.lk or facebook.com/page"></div>' +
        '<div class="field"><label>Business registration no. (optional)</label><input type="text" name="RegNo" maxlength="50" value="' + esc(b.RegNo) + '"></div>' +
        '<div class="field full"><label>Business address</label><textarea name="Address" maxlength="500">' + esc(b.Address) + '</textarea></div>' +
      '</div>' +
      '<div data-pane="invoice" class="form-grid hidden">' +
        '<div class="field"><label>Invoice prefix <span class="req">*</span></label><input type="text" name="InvoicePrefix" maxlength="10" value="' + esc(b.InvoicePrefix) + '" style="text-transform:uppercase">' +
          '<span class="hint">Invoices will be numbered like <b id="pfx-demo">' + esc(b.InvoicePrefix || 'INV') + '-' + todayStr().slice(0, 4) + '-0001</b></span></div>' +
        '<div class="field"><label>Currency</label><select name="Currency">' + currencies.map(function (c) {

        }).join('') + '</select></div>' +
        '<div class="field full"><label>Payment details</label><textarea name="PaymentDetails" maxlength="2000" placeholder="Bank: ...&#10;Account name: ...&#10;Account no: ...&#10;Branch: ...">' + esc(b.PaymentDetails) + '</textarea>' +
          '<span class="hint">Shown on every invoice so customers know how to pay.</span></div>' +
        '<div class="field full"><label>Default terms &amp; conditions</label><textarea name="DefaultTerms" maxlength="3000" style="min-height:110px">' + esc(b.DefaultTerms) + '</textarea>' +
          '<span class="hint">Pre-filled on new invoices. You can change it per invoice.</span></div>' +
      '</div>' +
      '<div data-pane="logo" class="hidden">' +
        '<div class="logo-drop"><div class="prev" id="logo-prev" style="' + (b.logoDataUrl ? 'background-image:url(' + b.logoDataUrl + ')' : '') + '">' + (b.logoDataUrl ? '' : icon('building')) + '</div>' +
        '<div><div style="font-weight:600">Business logo</div><div class="small muted" style="margin:4px 0 12px">PNG, JPG or WEBP, up to 2 MB. Large images are resized automatically.</div>' +
        '<div class="flex flex-wrap"><label class="btn btn-sm" style="cursor:pointer">' + icon('upload') + ' Choose image<input type="file" id="logo-file" accept="image/png,image/jpeg,image/webp" hidden></label>' +
        (!isNew && b.HasLogo ? '<button class="btn btn-sm btn-soft-danger" id="logo-remove" type="button">' + icon('trash') + ' Remove</button>' : '') +
        '</div></div></div></div>';

    const m = UI.modal({
      title: isNew ? 'Create business' : 'Edit business', size: 'lg', body: body, static: true,
      buttons: [
        { label: 'Cancel', close: true },
        { label: isNew ? 'Create business' : 'Save changes', cls: 'btn-primary', onClick: async function (mm) {
          const d = UI.formData(mm.body);
          if (!d.BusinessName.trim()) { switchTab('profile'); throw new Error('Business name is required.'); }

          UI.toast(isNew ? 'Business created.' : 'Business updated.');

      m.el.querySelectorAll('.tab').forEach(function (x) { x.classList.toggle('active', x.dataset.tab === t); });

    }
    m.el.querySelectorAll('.tab').forEach(function (t) { t.onclick = function () { switchTab(t.dataset.tab); }; });

    const pfx = m.el.querySelector('[name=InvoicePrefix]');
    pfx.oninput = function () {
      pfx.value = pfx.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
      m.el.querySelector('#pfx-demo').textContent = (pfx.value || 'INV') + '-' + todayStr().slice(0, 4) + '-0001';
    };

    m.el.querySelector('#logo-file').onchange = async function (e) {
      const f = e.target.files[0];
      if (!f) return;
      try {
        pendingLogo = await Biz.prepareLogo(f);
        const prev = m.el.querySelector('#logo-prev');
        prev.style.backgroundImage = 'url(' + pendingLogo + ')';
        prev.innerHTML = '';
        UI.toast('Logo ready. It will be uploaded when you save.', 'info');
      } catch (err) { UI.error(err); e.target.value = ''; }
    };
    const rm = m.el.querySelector('#logo-remove');
    if (rm) rm.onclick = async function () {
      if (!await UI.confirm({ title: 'Remove logo', message: 'Remove the logo from this business?', confirmText: 'Remove', danger: true })) return;
      try {
        await API.call('business.removeLogo', { businessId: b.BusinessId });
        const prev = m.el.querySelector('#logo-prev');
        prev.style.backgroundImage = ''; prev.innerHTML = icon('building');
        rm.remove(); pendingLogo = null;
        UI.toast('Logo removed.');
      } catch (err) { UI.error(err); }
    };
  },

  /** Validates and resizes a logo image in the browser. Returns a data URL. */
  prepareLogo: function (file) {
    return new Promise(function (resolve, reject) {
      const okTypes = ['image/png', 'image/jpeg', 'image/webp'];
      if (okTypes.indexOf(file.type) === -1) return reject(new Error('Logo must be a PNG, JPG or WEBP image.'));
      if (file.size > 2 * 1024 * 1024) return reject(new Error('Logo must be 2 MB or smaller.'));
      const reader = new FileReader();
      reader.onerror = function () { reject(new Error('Could not read the file.')); };
      reader.onload = function () {
        const img = new Image();
        img.onerror = function () { reject(new Error('The file is not a valid image.')); };
        img.onload = function () {
          const maxSide = 512;
          const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
          const w = Math.max(1, Math.round(img.width * scale)), h = Math.max(1, Math.round(img.height * scale));
          const c = document.createElement('canvas');
          c.width = w; c.height = h;
          const ctx = c.getContext('2d');
          const asJpeg = file.type === 'image/jpeg';
          if (asJpeg) { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); }
          ctx.drawImage(img, 0, 0, w, h);
          resolve(c.toDataURL(asJpeg ? 'image/jpeg' : 'image/png', 0.9));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }
};
