App.pages['quotation-view'] = {
  title: 'Quotation',
  nav: 'quotations',
  render: async function (el, params) {
    if (!params.id) return App.go('quotations');
    const res = await Promise.all([
      API.call('quotations.get', { quoteId: params.id }, { silent: true }),
      API.call('invoices.html', { invoiceId: params.id }, { silent: true })
    ]);
    const full = res[0], html = res[1].html, hasLogo = res[1].hasLogo;
    const q = full.invoice, cust = full.customer || {};
    const status = full.quoteStatus;
    const linked = full.linkedInvoice;
    const converted = !!linked;
    const reload = function () { App.go('quotation-view', { id: q.InvoiceId }); };
    document.getElementById('topbar-title').textContent = q.InvoiceNo;

    const histHtml = full.history.length ? '<ul class="timeline">' + full.history.map(function (h) {
      const extra = Inv.historyText(h);
      return '<li><div style="font-weight:600">' + esc(Quotes.HISTORY_LABELS[h.action] || Inv.HISTORY_LABELS[h.action] || h.action) + '</div>' +
        (extra ? '<div class="small">' + extra + '</div>' : '') +
        '<div class="when">' + fmtDateTime(h.at) + (h.by ? ' &middot; ' + esc(h.by) : '') + '</div></li>';
    }).join('') + '</ul>' : '<div class="small muted">No history yet.</div>';

    const statusBtns = converted ? '' :
      (status !== 'Accepted' ? '<button class="btn btn-sm" data-a="accept">' + icon('check') + ' Mark accepted</button>' : '') +
      (status !== 'Declined' ? '<button class="btn btn-sm" data-a="decline">' + icon('ban') + ' Mark declined</button>' : '') +
      (status === 'Accepted' || status === 'Declined' ? '<button class="btn btn-sm" data-a="reopen">' + icon('refresh') + ' Re-open</button>' : '');

    const banner = converted
      ? '<div class="alert alert-info" style="margin-bottom:16px;align-items:center">' + icon('check') + '<div class="grow">This quotation was converted to invoice <b>' + esc(linked.InvoiceNo) + '</b>. Edit the invoice and record payments there.</div>' +
        '<button class="btn btn-sm btn-primary" data-a="open-inv">' + icon('invoice') + ' Open ' + esc(linked.InvoiceNo) + '</button></div>'
      : status === 'Expired'
      ? '<div class="alert alert-warn" style="margin-bottom:16px">' + icon('clock') + '<div>This quotation expired on <b>' + fmtDate(q.DueDate) + '</b>. Edit it to extend the valid-until date, or duplicate it to send a fresh quote.</div></div>'
      : status === 'Declined'
      ? '<div class="alert alert-warn" style="margin-bottom:16px">' + icon('alert') + '<div>The customer declined this quotation. Re-open it if they change their mind.</div></div>'
      : '';

    el.innerHTML =
      '<div class="page-head"><div><div class="flex" style="gap:10px"><button class="btn btn-ghost btn-icon" id="qv-back" title="Back to quotations">' + icon('back') + '</button>' +
        '<h1>' + esc(q.InvoiceNo) + '</h1>' + statusBadge(status) + '</div>' +
        '<p>' + esc(cust.CustomerName || '-') + ' &middot; ' + fmtDate(q.InvoiceDate) + (q.RefNo ? ' &middot; Ref ' + esc(q.RefNo) : '') + '</p></div>' +
      '<div class="actions">' +
        (converted ? '<button class="btn btn-primary" data-a="open-inv">' + icon('invoice') + ' Open ' + esc(linked.InvoiceNo) + '</button>'
                   : '<button class="btn btn-primary" data-a="convert">' + icon('invoice') + ' Convert to invoice</button>') +
        '<button class="btn btn-wa" data-a="wa">' + icon('whatsapp') + '<span class="hide-sm"> WhatsApp</span></button>' +
      '</div></div>' +

      '<div class="card" style="margin-bottom:16px"><div class="card-body toolbar">' +
        (!converted ? '<button class="btn btn-sm" data-a="edit">' + icon('edit') + ' Edit</button>' : '') +
        '<button class="btn btn-sm" data-a="preview">' + icon('eye') + ' Preview</button>' +
        '<button class="btn btn-sm" data-a="pdf">' + icon('download') + ' Download PDF</button>' +
        '<button class="btn btn-sm" data-a="print">' + icon('print') + ' Print</button>' +
        '<button class="btn btn-sm" data-a="email">' + icon('mail') + ' Email</button>' +
        '<button class="btn btn-sm" data-a="logo">' + icon('upload') + ' Logo</button>' +
        '<button class="btn btn-sm" data-a="dup">' + icon('copy') + ' Duplicate</button>' +
        statusBtns +
        '<button class="btn btn-sm btn-soft-danger" data-a="delete">' + icon('trash') + ' Delete</button>' +
      '</div></div>' +

      (!hasLogo ? '<div class="alert alert-info" style="margin-bottom:16px;align-items:center">' + icon('info') + '<div class="grow">This quotation has no logo. Add your logo so it appears on the quotation, PDF and print.</div><button class="btn btn-sm btn-primary" data-a="logo">' + icon('upload') + ' Add logo</button></div>' : '') +
      banner +

      '<div class="view-grid"><div class="card preview-wrap"><iframe class="preview-frame" id="qv-frame" title="Quotation"></iframe></div>' +
      '<div style="display:grid;gap:16px">' +
        '<div class="card"><div class="card-head"><h2>Summary</h2></div><div class="card-body">' +
          '<div class="sum-row"><span>Quoted total</span><span class="v" style="font-size:16px">' + money(q.GrandTotal) + '</span></div>' +
          '<div class="sum-row"><span>Quotation date</span><span class="v">' + fmtDate(q.InvoiceDate) + '</span></div>' +
          '<div class="sum-row"><span>Valid until</span><span class="v"' + (status === 'Expired' ? ' style="color:var(--danger)"' : '') + '>' + fmtDate(q.DueDate) + '</span></div>' +
          '<div class="sum-row"><span>Status</span><span>' + statusBadge(status) + '</span></div>' +
          (converted ? '<div class="sum-row"><span>Invoice</span><span class="v"><a href="#" data-a="open-inv">' + esc(linked.InvoiceNo) + '</a></span></div>' : '') +
          '<div class="cust-card mt-2"><div style="font-weight:600">' + esc(cust.CustomerName || '-') + '</div>' +
            '<div class="muted">' + [cust.Phone, cust.Email].filter(Boolean).map(esc).join(' &middot; ') + '</div>' +
            (q.CustomerId ? '' : '<div class="small muted mt-1">One-time customer</div>') + '</div>' +
          (!converted ? '<button class="btn btn-primary btn-block mt-2" data-a="convert">' + icon('invoice') + ' Convert to invoice</button>' : '') +
        '</div></div>' +
        '<div class="card"><div class="card-head"><h2>History</h2></div><div class="card-body">' + histHtml + '</div></div>' +
      '</div></div>';

    const frame = el.querySelector('#qv-frame');
    const wrap = frame.parentNode;
    const fit = function () {
      try {
        const docH = frame.contentDocument.documentElement.scrollHeight + 20;
        const avail = wrap.clientWidth;
        const base = 860;
        if (avail < base) {
          const k = avail / base;
          frame.style.width = base + 'px';
          frame.style.height = docH + 'px';
          frame.style.transform = 'scale(' + k + ')';
          wrap.style.height = Math.ceil(docH * k) + 'px';
        } else {
          frame.style.width = ''; frame.style.transform = ''; wrap.style.height = '';
          frame.style.height = Math.max(700, docH) + 'px';
        }
      } catch (e) { /* ignore */ }
    };
    frame.onload = fit;
    frame.srcdoc = html;
    const onResize = debounce(function () { if (!document.body.contains(frame)) return window.removeEventListener('resize', onResize); fit(); }, 150);
    window.addEventListener('resize', onResize);

    el.querySelector('#qv-back').onclick = function () { App.go('quotations'); };
    el.onclick = async function (e) {
      const a = e.target.closest('[data-a]');
      if (!a) return;
      if (a.tagName === 'A') e.preventDefault();
      try {
        switch (a.dataset.a) {
          case 'convert': {
            const r = await Quotes.convert(q, status);
            if (r) App.go('invoice-view', { id: r.InvoiceId });
            break;
          }
          case 'open-inv': App.go('invoice-view', { id: linked.InvoiceId }); break;
          case 'wa': await Inv.whatsapp(q.InvoiceId); break;
          case 'edit': App.go('quotation-edit', { id: q.InvoiceId }); break;
          case 'preview': await Inv.preview(q.InvoiceId); break;
          case 'pdf': await Inv.pdf(q.InvoiceId); break;
          case 'print': UI.printHtml(html); break;
          case 'email': if (await Inv.email(q.InvoiceId, q, cust)) reload(); break;
          case 'logo': if (await Inv.logoManager()) reload(); break;
          case 'dup': await Quotes.duplicate(q); break;
          case 'accept': if (await Quotes.setStatus(q, 'Accepted')) reload(); break;
          case 'decline': if (await Quotes.setStatus(q, 'Declined')) reload(); break;
          case 'reopen': if (await Quotes.setStatus(q, 'Open')) reload(); break;
          case 'delete': if (await Quotes.remove(q)) App.go('quotations'); break;
        }
      } catch (err) { UI.error(err); }
    };
  }
};
</script>

  <script>
/* ============================================================
   DacaBilling - JS_Payments.html
   Record payment modal, void payment, payments history page.
   ============================================================ */
const Payments = {
  /** Opens the record-payment modal. Resolves true when saved. */
  record: async function (invoiceId) {
    const full = await API.call('invoices.get', { invoiceId: invoiceId });
    const inv = full.invoice;
    if (inv.Status === 'Cancelled') throw new Error('Payments cannot be added to a cancelled invoice.');
    if (!(inv.Balance > 0)) throw new Error('This invoice is already fully paid.');
    const methods = (App.state.lists && App.state.lists.paymentMethods) || ['Cash', 'Bank Transfer', 'Card', 'Cheque', 'Online Payment', 'Other'];

    return new Promise(function (resolve) {
      let saved = false;
      const m = UI.modal({
        title: 'Record payment - ' + inv.InvoiceNo,
        onClose: function () { resolve(saved); },
        body:
          '<div class="cust-card flex" style="justify-content:space-between;margin-bottom:16px;flex-wrap:wrap">' +
            '<div><div class="small muted">Customer</div><div style="font-weight:600">' + esc((full.customer || {}).CustomerName || '-') + '</div></div>' +
            '<div><div class="small muted">Total</div><div style="font-weight:600">' + money(inv.GrandTotal) + '</div></div>' +
            '<div><div class="small muted">Paid</div><div style="font-weight:600">' + money(inv.TotalPaid) + '</div></div>' +
            '<div><div class="small muted">Balance</div><div style="font-weight:700;color:var(--danger)">' + money(inv.Balance) + '</div></div>' +
          '</div>' +
          '<div class="form-grid">' +
            '<div class="field"><label>Amount <span class="req">*</span></label><input type="number" name="Amount" min="0.01" max="' + inv.Balance + '" step="0.01" value="' + inv.Balance + '">' +
              '<span class="hint"><a href="#" id="pay-full">Full balance</a> &middot; <a href="#" id="pay-half">Half</a></span></div>' +
            '<div class="field"><label>Payment date <span class="req">*</span></label><input type="date" name="PaymentDate" value="' + todayStr() + '" max="' + todayStr() + '"></div>' +
            '<div class="field"><label>Method <span class="req">*</span></label><select name="Method">' + methods.map(function (x) {
              return '<option ' + (x === inv.PaymentMethod ? 'selected' : '') + '>' + esc(x) + '</option>';
            }).join('') + '</select></div>' +
            '<div class="field"><label>Reference</label><input type="text" name="Reference" maxlength="80" placeholder="Cheque / transfer ref."></div>' +
            '<div class="field full"><label>Notes</label><textarea name="Notes" maxlength="300"></textarea></div>' +
          '</div>' +
          '<div class="small muted mt-2" id="pay-after"></div>',
        buttons: [
          { label: 'Cancel', close: true },
          { label: 'Save payment', cls: 'btn-success', icon: 'check', onClick: async function (mm) {
            const d = UI.formData(mm.body);
            const amt = round2(parseFloat(d.Amount));
            if (!(amt > 0)) throw new Error('Enter an amount more than 0.');
            if (amt > inv.Balance) throw new Error('Amount is more than the balance (' + money(inv.Balance) + ').');
            if (!d.PaymentDate) throw new Error('Select the payment date.');
            d.Amount = amt; d.InvoiceId = inv.InvoiceId;
            const r = await API.call('payments.add', { payment: d });
            saved = true;
            UI.toast('Payment of ' + money(amt) + ' recorded. Status: ' + r.invoice.Status + '.');
            mm.close();
          } }
        ]
      });
      const amtEl = m.el.querySelector('[name=Amount]'), after = m.el.querySelector('#pay-after');
      const upd = function () {
        const a = round2(parseFloat(amtEl.value) || 0);
        const bal = round2(inv.Balance - a);
        after.innerHTML = a > inv.Balance ? '<span style="color:var(--danger)">Amount is more than the balance.</span>'
          : 'After this payment: balance <b>' + money(Math.max(0, bal)) + '</b> &middot; status <b>' + (bal <= 0 ? 'Paid' : 'Partially Paid') + '</b>';
      };
      amtEl.oninput = upd; upd();
      m.el.querySelector('#pay-full').onclick = function (e) { e.preventDefault(); amtEl.value = inv.Balance; upd(); };
      m.el.querySelector('#pay-half').onclick = function (e) { e.preventDefault(); amtEl.value = round2(inv.Balance / 2); upd(); };
    });
  },

  /** Voids a payment with a reason. Resolves true when voided. */
  voidPayment: async function (paymentId) {
    const reason = await UI.prompt({
      title: 'Void payment', danger: true, confirmText: 'Void payment', multiline: true,
      message: 'Voided payments stay in the history but no longer count toward the invoice.',
      label: 'Reason', placeholder: 'e.g. Cheque returned'
    });
    if (reason === null) return false;
    const r = await API.call('payments.void', { paymentId: paymentId, reason: reason });
    UI.toast('Payment voided. Invoice is now ' + r.invoice.Status + '.');
    return true;
  }
};

        }).join('');

        if (!r.expenses.length) {

            r.expenses.map(function (e) {
              return '<tr class="clickable" data-id="' + esc(e.ExpenseId) + '"><td class="nowrap">' + fmtDate(e.ExpenseDate) + '</td>' +
                '<td><div class="strong">' + esc(e.Category) + '</div><div class="small muted show-sm">' + esc(e.Description || '') + '</div></td>' +
                '<td class="hide-sm"><div class="ellipsis" style="max-width:280px">' + esc(e.Description || '-') + '</div>' + (e.Reference ? '<div class="small muted">' + esc(e.Reference) + '</div>' : '') + '</td>' +
                '<td class="hide-sm">' + esc(e.PaymentMethod || '-') + '</td>' +
                '<td class="num nowrap amount">' + money(e.Amount) + '</td>' +
                '<td class="actions nowrap right"><button class="btn btn-sm btn-ghost btn-icon" title="Edit" data-act="edit" data-id="' + esc(e.ExpenseId) + '">' + icon('edit') + '</button>' +
                '<button class="btn btn-sm btn-ghost btn-icon" title="Delete" data-act="del" data-id="' + esc(e.ExpenseId) + '">' + icon('trash') + '</button></td></tr>';
            }).join('') + '</tbody></table></div>';
        }
        hydrateIcons(el);
      } catch (e) {
        if (my === reqId) body.innerHTML = '<div class="card-body"><div class="alert alert-error">' + icon('alert') + '<div>' + esc(e.message) + '</div></div></div>';
      } finally { body.style.opacity = ''; }
    };

    const add = async function () { if (await Expenses.openForm(null, last && last.categories)) load(); };
    el.querySelector('#ex-add').onclick = add;
    el.querySelector('#ex-csv').onclick = function () {
      if (!last || !last.expenses.length) return UI.toast('No expenses to export.', 'info');
      Expenses.csv(last.expenses);
    };
    el.querySelector('#ef-q').oninput = debounce(function (e) { f.q = e.target.value.trim(); load(); }, 300);
    catSel.onchange = function (e) { f.category = e.target.value; load(); };
    el.querySelector('#ef-method').onchange = function (e) { f.method = e.target.value; load(); };
    el.querySelector('#ef-from').onchange = function (e) { f.from = e.target.value; load(); };
    el.querySelector('#ef-to').onchange = function (e) { f.to = e.target.value; load(); };
    el.querySelector('#ef-month').onclick = function () {
      f.from = monthStart(); f.to = todayStr();
      el.querySelector('#ef-from').value = f.from; el.querySelector('#ef-to').value = f.to; load();
    };
    el.querySelector('#ef-all').onclick = function () {
      f.from = ''; f.to = '';
      el.querySelector('#ef-from').value = ''; el.querySelector('#ef-to').value = ''; load();
    };
    body.onclick = async function (e) {
      const b = e.target.closest('[data-act]');
      if (b && b.dataset.act === 'add') return add();
      const id = (b && b.dataset.id) || (e.target.closest('tr[data-id]') || {}).dataset && e.target.closest('tr[data-id]').dataset.id;
      if (!id || !last) return;
      const ex = last.expenses.filter(function (x) { return x.ExpenseId === id; })[0];
      if (!ex) return;
      try {
        if (b && b.dataset.act === 'del') { await Expenses.remove(ex, load); load(); return; }
        if (await Expenses.openForm(ex, last.categories)) load();
      } catch (err) { UI.error(err); }
    };
    await load();
  }
};
</script>

  <script>
/* ============================================================
   DacaBilling - JS_Inventory.html   (Update 6)
   Stock for "Product" items: list, opening stock, receive,
   use / damaged, stock count, stock card with Undo delete.
   Sales on invoices reduce stock automatically.
   ============================================================ */
function qtyFmt(n) {
  n = Number(n) || 0;
  return (Math.round(n * 1000) / 1000).toLocaleString('en-US', { maximumFractionDigits: 3 });
}

const Inventory = {
  TYPES: {
    OPENING: { title: 'Set opening stock', qty: 'Opening quantity', btn: 'Save opening stock', cost: true,
      help: 'How many do you have right now? Sales on invoices from this date onwards will reduce the stock automatically.' },
    IN: { title: 'Receive stock', qty: 'Quantity received', btn: 'Add to stock', cost: true,
      help: 'New stock bought or produced. It is added to the stock on hand.' },
    OUT: { title: 'Use / damaged', qty: 'Quantity to remove', btn: 'Remove from stock', cost: false,
      help: 'Stock used inside the business, damaged, lost or given free (not sold on an invoice).' },
    COUNT: { title: 'Stock count', qty: 'Counted quantity', btn: 'Save count', cost: false,
      help: 'Enter the real quantity you counted. The app saves the difference as an adjustment.' }
  },

  /** Opens the stock movement form. Resolves true when saved. */
  openMove: function (item, type) {
    const t = Inventory.TYPES[type];
    return new Promise(function (resolve) {
      let ok = false;
      const unit = item.Unit ? ' (' + esc(item.Unit) + ')' : '';
      const m = UI.modal({
        title: t.title + ' - ' + item.ItemName,
        onClose: function () { resolve(ok); },
        body: '<div class="alert alert-info">' + icon('info') + '<div>' + esc(t.help) +
            (item.tracked ? '<br>In the app now: <b>' + qtyFmt(item.onHand) + ' ' + esc(item.Unit || '') + '</b>' : '') + '</div></div>' +
          '<div class="form-grid mt-2">' +
          '<div class="field"><label>' + esc(t.qty) + unit + ' <span class="req">*</span></label><input type="number" name="qty" class="num" min="0" step="any" placeholder="0"' +
            (type === 'COUNT' ? ' value="' + esc(qtyFmt(item.onHand).replace(/,/g, '')) + '"' : '') + '></div>' +
          '<div class="field"><label>Date <span class="req">*</span></label><input type="date" name="date" value="' + todayStr() + '"' + (item.since ? ' min="' + esc(item.since) + '"' : '') + '></div>' +
          (t.cost ? '<div class="field"><label>Cost per unit (' + esc(App.state.business.Currency) + ')</label><input type="number" name="unitCost" class="num" min="0" step="0.01" value="' + esc(item.CostPrice || '') + '" placeholder="Optional"></div>' : '') +
          '<div class="field' + (t.cost ? '' : ' full') + '"><label>Reference</label><input type="text" name="reference" maxlength="80" placeholder="Bill / GRN no. (optional)"></div>' +
          '<div class="field full"><label>Note</label><input type="text" name="note" maxlength="300" placeholder="Optional"></div>' +
          '</div>',
        buttons: [
          { label: 'Cancel', close: true },
          { label: t.btn, cls: 'btn-primary', icon: 'check', onClick: async function (mm) {
            const d = UI.formData(mm.body);
            if (d.qty === '' || isNaN(parseFloat(d.qty))) throw new Error('Enter the quantity.');
            if (type !== 'COUNT' && type !== 'OPENING' && !(parseFloat(d.qty) > 0)) throw new Error('Quantity must be more than 0.');
            d.itemId = item.ItemId; d.type = type;
            const r = await API.call('inventory.move', d);
            UI.toast(type === 'COUNT' ? 'Stock count saved (' + (r.qty > 0 ? '+' : '') + qtyFmt(r.qty) + ').' : 'Stock updated. On hand: ' + qtyFmt(r.item.onHand) + ' ' + (r.item.Unit || ''));
            ok = true;
            mm.close();
          } }
        ]
      });
      setTimeout(function () { const q = m.el.querySelector('[name=qty]'); if (q) { q.focus(); q.select && q.select(); } }, 80);
    });
  },

  openSettings: function (item) {
    return new Promise(function (resolve) {
      let ok = false;
      UI.modal({
        title: 'Stock settings - ' + item.ItemName,
        onClose: function () { resolve(ok); },
        body: '<div class="form-grid">' +
          '<div class="field"><label>Low stock alert at' + (item.Unit ? ' (' + esc(item.Unit) + ')' : '') + '</label><input type="number" name="reorderLevel" class="num" min="0" step="any" value="' + esc(item.ReorderLevel || '') + '" placeholder="0">' +
            '<div class="small muted mt-1">Shows "Low stock" when on hand is at or below this.</div></div>' +
          '<div class="field"><label>Cost price (' + esc(App.state.business.Currency) + ')</label><input type="number" name="costPrice" class="num" min="0" step="0.01" value="' + esc(item.CostPrice || '') + '" placeholder="0.00">' +
            '<div class="small muted mt-1">Used for the stock value.</div></div>' +
          '</div>',
        buttons: [
          { label: 'Cancel', close: true },
          { label: 'Save', cls: 'btn-primary', icon: 'check', onClick: async function (mm) {
            const d = UI.formData(mm.body);
            d.itemId = item.ItemId;
            await API.call('inventory.settings', d);

  actionsHtml: function (i) {

  <script>
/* ============================================================
   DacaBilling - JS_Reports.html   (Update 6)
   Sales, collections, expenses, profit, top customers / items,
   payment methods, outstanding aging, quotations.
   Date range presets, CSV export, print.
   ============================================================ */
const Reports = {
  range: function (preset) {
    const t = todayStr(), y = +t.slice(0, 4), m = +t.slice(5, 7);
    const pad = function (n) { return ('0' + n).slice(-2); };
    const lastDay = function (yy, mm) { return new Date(Date.UTC(yy, mm, 0)).getUTCDate(); };
    if (preset === 'last-month') {
      const ly = m === 1 ? y - 1 : y, lm = m === 1 ? 12 : m - 1;
      return { from: ly + '-' + pad(lm) + '-01', to: ly + '-' + pad(lm) + '-' + pad(lastDay(ly, lm)) };
    }
    if (preset === 'last-3') {
      const d = new Date(Date.UTC(y, m - 3, 1));
      return { from: d.toISOString().slice(0, 10), to: t };
    }
    if (preset === 'year') return { from: y + '-01-01', to: t };
    if (preset === 'last-year') return { from: (y - 1) + '-01-01', to: (y - 1) + '-12-31' };
    return { from: monthStart(), to: t };
  },

  bar: function (v, max, color) {
    const w = max > 0 ? Math.max(0, Math.min(100, Math.abs(v) / max * 100)) : 0;
    return '<div class="rbar"><span style="width:' + w.toFixed(1) + '%;background:' + color + '"></span></div>';
  },

  table: function (head, rows, empty) {
    if (!rows.length) return '<div class="card-body small muted">' + esc(empty || 'No data for this period.') + '</div>';
    return '<div class="table-wrap"><table class="table"><thead><tr>' + head.map(function (h) {
      return '<th' + (h.num ? ' class="num"' : '') + '>' + esc(h.t) + '</th>';
    }).join('') + '</tr></thead><tbody>' + rows.join('') + '</tbody></table></div>';
  },

  csv: function (r) {
    const L = [];
    L.push(['Report', App.state.business.BusinessName], ['From', r.from], ['To', r.to], []);
    const t = r.totals;
    L.push(['Summary', 'Amount'], ['Sales (invoiced)', t.sales], ['Invoices', t.invoiceCount], ['Collected', t.collected],
      ['Expenses', t.expenses], ['Profit (collected - expenses)', t.profitCash], ['Profit (sales - expenses)', t.profitSales],
      ['Tax', t.tax], ['Discounts', t.discounts], ['Average invoice', t.averageInvoice], ['Outstanding now', t.outstandingNow], []);
    L.push(['Month', 'Invoices', 'Sales', 'Collected', 'Expenses', 'Profit']);
    r.months.forEach(function (m) { L.push([m.label, m.invoices, m.sales, m.collected, m.expenses, m.profit]); });
    L.push([], ['Top customers', 'Invoices', 'Sales', 'Balance due']);
    r.topCustomers.forEach(function (c) { L.push([c.name, c.invoices, c.total, c.balance]); });
    L.push([], ['Top items', 'Qty', 'Unit', 'Sales']);
    r.topItems.forEach(function (i) { L.push([i.name, i.qty, i.unit, i.total]); });
    L.push([], ['Payment method', 'Payments', 'Amount']);
    r.methods.forEach(function (x) { L.push([x.method, x.count, x.total]); });
    L.push([], ['Expense category', 'Entries', 'Amount']);
    r.expenseCategories.forEach(function (x) { L.push([x.category, x.count, x.total]); });
    L.push([], ['Outstanding (aging)', 'Invoices', 'Amount']);
    r.aging.forEach(function (x) { L.push([x.label, x.count, x.total]); });
    downloadCsv('report-' + r.from + '-to-' + r.to + '.csv', L);
  },

  print: function (r) {
    const b = App.state.business, t = r.totals;
    const row = function (cells, bold) {
      return '<tr' + (bold ? ' style="font-weight:700"' : '') + '>' + cells.map(function (c, i) {
        return '<td' + (i ? ' style="text-align:right"' : '') + '>' + esc(c) + '</td>';
      }).join('') + '</tr>';
    };
    const tbl = function (title, head, rows) {
      if (!rows.length) return '';
      return '<h2>' + esc(title) + '</h2><table><thead>' + row(head, true) + '</thead><tbody>' + rows.join('') + '</tbody></table>';
    };
    const html = '<!doctype html><html><head><meta charset="utf-8"><title>Report ' + esc(r.from) + ' to ' + esc(r.to) + '</title><style>' +
      'body{font-family:Arial,Helvetica,sans-serif;color:#0F172A;margin:28px;font-size:12px}h1{font-size:20px;margin:0}h2{font-size:13px;margin:22px 0 6px;text-transform:uppercase;letter-spacing:.05em;color:#334155}' +
      '.sub{color:#64748B;margin-top:4px}table{width:100%;border-collapse:collapse}td{padding:6px 8px;border-bottom:1px solid #E2E8F0}thead td{background:#F1F5F9}' +
      '.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}.kp div{border:1px solid #E2E8F0;border-radius:8px;padding:10px}.kp b{display:block;font-size:15px;margin-top:4px}' +
      '@page{margin:14mm}</style></head><body>' +
      '<h1>' + esc(b.BusinessName) + ' - Business report</h1><div class="sub">' + fmtDate(r.from) + ' to ' + fmtDate(r.to) + ' · Printed ' + fmtDate(todayStr()) + '</div>' +
      '<div class="kp">' +
        [['Sales', t.sales], ['Collected', t.collected], ['Expenses', t.expenses], ['Profit (collected - expenses)', t.profitCash], ['Profit (sales - expenses)', t.profitSales], ['Outstanding now', t.outstandingNow]]
          .map(function (k) { return '<div>' + esc(k[0]) + '<b>' + esc(money(k[1])) + '</b></div>'; }).join('') +
      '</div>' +
      tbl('By month', ['Month', 'Invoices', 'Sales', 'Collected', 'Expenses', 'Profit'],
        r.months.map(function (m) { return row([m.label, cnt(m.invoices), money(m.sales), money(m.collected), money(m.expenses), money(m.profit)]); })) +
      tbl('Top customers', ['Customer', 'Invoices', 'Sales', 'Balance due'],
        r.topCustomers.map(function (c) { return row([c.name, cnt(c.invoices), money(c.total), money(c.balance)]); })) +
      tbl('Top items', ['Item', 'Qty', 'Sales'], r.topItems.map(function (i) { return row([i.name, qtyR(i.qty) + ' ' + (i.unit || ''), money(i.total)]); })) +
      tbl('Expenses by category', ['Category', 'Entries', 'Amount'], r.expenseCategories.map(function (x) { return row([x.category, cnt(x.count), money(x.total)]); })) +
      tbl('Payments by method', ['Method', 'Payments', 'Amount'], r.methods.map(function (x) { return row([x.method, cnt(x.count), money(x.total)]); })) +
      tbl('Outstanding (today)', ['Age', 'Invoices', 'Amount'], r.aging.map(function (x) { return row([x.label, cnt(x.count), money(x.total)]); })) +
      '</body></html>';
    UI.printHtml(html);
  }
};
function qtyR(n) { return (Math.round((Number(n) || 0) * 1000) / 1000).toLocaleString('en-US', { maximumFractionDigits: 3 }); }

App.pages.reports = {
  title: 'Reports',
  render: async function (el) {
    let range = Reports.range('month'), last = null;
    el.innerHTML =
      '<div class="page-head"><div><h1>Reports</h1><p>Sales, expenses and profit for <b>' + esc(App.state.business.BusinessName) + '</b>.</p></div>' +
      '<div class="actions"><button class="btn" id="rp-csv">' + icon('download') + '<span class="hide-sm"> Export CSV</span></button>' +
      '<button class="btn" id="rp-print">' + icon('print') + '<span class="hide-sm"> Print</span></button></div></div>' +
      '<div class="card"><div class="filters">' +
        '<select id="rp-preset"><option value="month">This month</option><option value="last-month">Last month</option><option value="last-3">Last 3 months</option>' +
        '<option value="year">This year</option><option value="last-year">Last year</option><option value="custom">Custom dates</option></select>' +
        '<input type="date" id="rp-from" value="' + range.from + '" title="From date">' +
        '<input type="date" id="rp-to" value="' + range.to + '" title="To date">' +
      '</div></div>' +
      '<div id="rp-body"><div class="empty"><div class="spinner" style="margin:0 auto"></div></div></div>';
    const body = el.querySelector('#rp-body'), fromI = el.querySelector('#rp-from'), toI = el.querySelector('#rp-to'), preset = el.querySelector('#rp-preset');

    const kpi = function (label, value, ic, color, foot) {
      return '<div class="card kpi"><div class="top"><span class="lbl">' + esc(label) + '</span><span class="ico ico-' + color + '">' + icon(ic) + '</span></div>' +
        '<div class="val">' + value + '</div><div class="foot">' + foot + '</div></div>';
    };

    let reqId = 0;
    const load = async function () {
      if (!range.from || !range.to) return;
      if (range.from > range.to) { body.innerHTML = '<div class="alert alert-warn mt-2">' + icon('alert') + '<div>The From date must be before the To date.</div></div>'; return; }
      const my = ++reqId;
      body.style.opacity = '.55';
      try {
        const r = await API.call('reports.get', range, { silent: true });
        if (my !== reqId) return;
        last = r;
        const t = r.totals;
        const maxM = Math.max.apply(null, [1].concat(r.months.map(function (m) { return Math.max(m.sales, m.collected, m.expenses); })));
        const maxC = Math.max.apply(null, [1].concat(r.expenseCategories.map(function (x) { return x.total; })));
        const maxMeth = Math.max.apply(null, [1].concat(r.methods.map(function (x) { return x.total; })));
        const profitColor = function (v) { return v < 0 ? 'var(--danger)' : 'var(--success)'; };
        const q = r.quotations || { count: 0 };

        body.innerHTML =
          '<div class="kpi-grid mt-2">' +
            kpi('Sales (invoiced)', money(t.sales), 'invoice', 'indigo', cnt(t.invoiceCount) + ' invoice' + (t.invoiceCount === 1 ? '' : 's') + (t.cancelledCount ? ' · ' + t.cancelledCount + ' cancelled (not counted)' : '')) +
            kpi('Collected', money(t.collected), 'cash', 'green', cnt(t.paymentCount) + ' payment' + (t.paymentCount === 1 ? '' : 's') + ' received') +
            kpi('Expenses', money(t.expenses), 'wallet', 'red', cnt(t.expenseCount) + ' expense entr' + (t.expenseCount === 1 ? 'y' : 'ies')) +
            kpi('Profit', '<span style="color:' + profitColor(t.profitCash) + '">' + money(t.profitCash) + '</span>', 'trend', 'blue', 'Collected - expenses · On sales: ' + money(t.profitSales)) +
          '</div>' +
          '<div class="chips card mt-2" style="border-radius:var(--radius)">' +
            '<span>Average invoice <b>' + money(t.averageInvoice) + '</b></span><span>Tax <b>' + money(t.tax) + '</b></span>' +
            '<span>Discounts given <b>' + money(t.discounts) + '</b></span><span>Unpaid from this period <b>' + money(t.unpaidFromRange) + '</b></span>' +
            '<span>Outstanding today <b style="color:var(--danger)">' + money(t.outstandingNow) + '</b> (' + cnt(t.outstandingCount) + ')</span>' +
            (q.count ? '<span>Quotations <b>' + cnt(q.count) + '</b> · converted <b>' + cnt(q.converted) + '</b> (' + (q.rate || 0) + '%)</span>' : '') +
          '</div>' +

          '<div class="card mt-2"><div class="card-head"><h2>By month</h2><div class="legend"><span><i style="background:var(--primary)"></i>Sales</span><span><i style="background:var(--success)"></i>Collected</span><span><i style="background:var(--danger)"></i>Expenses</span></div></div>' +
          Reports.table([{ t: 'Month' }, { t: 'Sales / collected / expenses' }, { t: 'Sales', num: 1 }, { t: 'Collected', num: 1 }, { t: 'Expenses', num: 1 }, { t: 'Profit', num: 1 }],
            r.months.map(function (m) {
              return '<tr><td class="nowrap strong">' + esc(m.label) + '<div class="small muted">' + cnt(m.invoices) + ' inv.</div></td>' +
                '<td style="min-width:140px">' + Reports.bar(m.sales, maxM, 'var(--primary)') + Reports.bar(m.collected, maxM, 'var(--success)') + Reports.bar(m.expenses, maxM, 'var(--danger)') + '</td>' +
                '<td class="num nowrap">' + money(m.sales) + '</td><td class="num nowrap">' + money(m.collected) + '</td><td class="num nowrap">' + money(m.expenses) + '</td>' +
                '<td class="num nowrap strong" style="color:' + profitColor(m.profit) + '">' + money(m.profit) + '</td></tr>';
            })) + '</div>' +

          '<div class="rp-grid mt-2">' +
            '<div class="card"><div class="card-head"><h2>Top customers</h2></div>' +
            Reports.table([{ t: 'Customer' }, { t: 'Invoices', num: 1 }, { t: 'Sales', num: 1 }, { t: 'Due', num: 1 }],
              r.topCustomers.map(function (c) {
                return '<tr><td class="strong">' + esc(c.name) + '</td><td class="num">' + cnt(c.invoices) + '</td><td class="num nowrap">' + money(c.total) + '</td>' +
                  '<td class="num nowrap"' + (c.balance > 0 ? ' style="color:var(--danger)"' : '') + '>' + money(c.balance) + '</td></tr>';
              })) + '</div>' +
            '<div class="card"><div class="card-head"><h2>Top products & services</h2></div>' +
            Reports.table([{ t: 'Item' }, { t: 'Qty', num: 1 }, { t: 'Sales', num: 1 }],
              r.topItems.map(function (i) {
                return '<tr><td class="strong">' + esc(i.name) + '</td><td class="num nowrap">' + qtyR(i.qty) + ' <span class="small muted">' + esc(i.unit || '') + '</span></td><td class="num nowrap">' + money(i.total) + '</td></tr>';
              })) + '</div>' +
            '<div class="card"><div class="card-head"><h2>Expenses by category</h2><button class="btn btn-sm btn-ghost" data-go="expenses">View expenses</button></div>' +
            Reports.table([{ t: 'Category' }, { t: '' }, { t: 'Amount', num: 1 }],
              r.expenseCategories.map(function (x) {
                return '<tr><td class="strong">' + esc(x.category) + '<div class="small muted">' + cnt(x.count) + ' entr' + (x.count === 1 ? 'y' : 'ies') + '</div></td><td style="width:35%">' + Reports.bar(x.total, maxC, 'var(--danger)') + '</td><td class="num nowrap">' + money(x.total) + '</td></tr>';
              }), 'No expenses recorded for this period.') + '</div>' +
            '<div class="card"><div class="card-head"><h2>Payments by method</h2></div>' +
            Reports.table([{ t: 'Method' }, { t: '' }, { t: 'Amount', num: 1 }],
              r.methods.map(function (x) {
                return '<tr><td class="strong">' + esc(x.method) + '<div class="small muted">' + cnt(x.count) + ' payment' + (x.count === 1 ? '' : 's') + '</div></td><td style="width:35%">' + Reports.bar(x.total, maxMeth, 'var(--success)') + '</td><td class="num nowrap">' + money(x.total) + '</td></tr>';
              }), 'No payments received in this period.') + '</div>' +
          '</div>' +

          '<div class="card mt-2"><div class="card-head"><h2>Outstanding today (all invoices)</h2><button class="btn btn-sm btn-ghost" data-go="invoices">View invoices</button></div>' +
          Reports.table([{ t: 'Age' }, { t: 'Invoices', num: 1 }, { t: 'Amount', num: 1 }],
            r.aging.map(function (a, k) {
              return '<tr><td>' + esc(a.label) + '</td><td class="num">' + cnt(a.count) + '</td><td class="num nowrap strong"' + (k > 0 && a.total > 0 ? ' style="color:var(--danger)"' : '') + '>' + money(a.total) + '</td></tr>';
            })) + '</div>' +
          '<p class="small muted mt-2">Sales use the invoice date. Collected uses the payment date. Cancelled and deleted invoices, voided payments and quotations are not counted.</p>';
        hydrateIcons(body);
        body.querySelectorAll('[data-go]').forEach(function (b) { b.onclick = function () { App.go(b.dataset.go); }; });
      } catch (e) {
        if (my === reqId) body.innerHTML = '<div class="alert alert-error mt-2">' + icon('alert') + '<div>' + esc(e.message) + '</div></div>';
      } finally { body.style.opacity = ''; }
    };

    preset.onchange = function () {
      if (preset.value === 'custom') { fromI.focus(); return; }
      range = Reports.range(preset.value);
      fromI.value = range.from; toI.value = range.to; load();
    };
    const custom = function () { preset.value = 'custom'; range = { from: fromI.value, to: toI.value }; load(); };
    fromI.onchange = custom; toI.onchange = custom;
    el.querySelector('#rp-csv').onclick = function () { if (last) Reports.csv(last); };
    el.querySelector('#rp-print').onclick = function () { if (last) Reports.print(last); };
    await load();
  }
};
</script>

  <script>
    document.addEventListener('DOMContentLoaded', function () { App.boot(); });
  </script>
