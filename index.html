  <script>
/* ============================================================
   DacaBilling - JS_Invoices.html
   Invoice list & search, invoice editor (create / edit) with
   live calculations, invoice view with preview, PDF, print,
   WhatsApp, email, duplicate, cancel/restore and history.
   Update 4: the editor also creates / edits QUOTATIONS
   (InvoiceEditor.render with docType 'QUOTATION').
   ============================================================ */
/* ---------------------------------------------------------------
   PdfMaker - builds the PDF in the browser from the SAME HTML as the
   on-screen preview, so the downloaded file looks exactly the same.
   Libraries are loaded only the first time a PDF is needed.
   --------------------------------------------------------------- */
const PdfMaker = {
  LIBS: [
    'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'
  ],
  WIDTH: 860,          // same base width as the preview
  MARGIN: 28,          // px, top margin on continuation pages / bottom margin
  _ready: null,

  load: function () {
    if (window.html2canvas && window.jspdf) return Promise.resolve();
    if (PdfMaker._ready) return PdfMaker._ready;
    PdfMaker._ready = PdfMaker.LIBS.reduce(function (p, src) {
      return p.then(function () {
        return new Promise(function (resolve, reject) {
          const s = document.createElement('script');
          s.src = src; s.async = true;
          s.onload = resolve;
          s.onerror = function () { reject(new Error('Could not load the PDF tools. Check your internet connection.')); };
          document.head.appendChild(s);
        });
      });
    }, Promise.resolve()).catch(function (e) { PdfMaker._ready = null; throw e; });
    return PdfMaker._ready;
  },

  /** Renders html off-screen and returns a jsPDF document. */
  build: async function (html) {
    await PdfMaker.load();
    const W = PdfMaker.WIDTH, M = PdfMaker.MARGIN;
    const frame = document.createElement('iframe');
    frame.setAttribute('aria-hidden', 'true');
    frame.style.cssText = 'position:fixed;left:-20000px;top:0;width:' + W + 'px;height:1400px;border:0;background:#fff';
    document.body.appendChild(frame);
    try {
      await new Promise(function (resolve) { frame.onload = resolve; frame.srcdoc = html; });
      const doc = frame.contentDocument;
      // wait for the logo and any other images
      await Promise.all(Array.prototype.map.call(doc.images, function (img) {
        return img.complete ? null : new Promise(function (r) { img.onload = img.onerror = r; });
      }));
      if (doc.fonts && doc.fonts.ready) { try { await doc.fonts.ready; } catch (e) { /* ignore */ } }
      const scale = 2;
      // Footer is drawn separately at the bottom of EVERY page.
      doc.body.classList.add('pdf-capture');
      const fEl = doc.querySelector('.inv-footer');
      let foot = null;
      if (fEl) {
        fEl.style.marginTop = '0';
        const fr = fEl.getBoundingClientRect();
        const fc = await window.html2canvas(fEl, { scale: scale, backgroundColor: '#ffffff', useCORS: true, logging: false });
        foot = { canvas: fc, x: fr.left, w: fr.width, h: fr.height };
        fEl.style.display = 'none';
      }
      // measure the real content height (not the iframe's own height)
      frame.style.height = '50px';
      const H = Math.max(200, Math.ceil(doc.documentElement.scrollHeight));
      frame.style.height = H + 'px';

      const canvas = await window.html2canvas(doc.documentElement, {
        scale: scale, backgroundColor: '#ffffff', useCORS: true, logging: false,
        width: W, height: H, windowWidth: W, windowHeight: H, scrollX: 0, scrollY: 0
      });

      // Safe places to start a new page: below rows/blocks, never through them.
      const blocks = [];
      doc.querySelectorAll('tr, .box, .label, img, .cancel, .title, .bname, .headband, .accent, body > *').forEach(function (n) {
        const r = n.getBoundingClientRect();
        if (r.height > 0) blocks.push([r.top, r.bottom]);
      });
      const textRows = [];
      doc.querySelectorAll('td, div').forEach(function (n) {
        if (n.children.length) return;           // leaf text blocks only
        const r = n.getBoundingClientRect();
        if (r.height > 0 && r.height < 400) textRows.push([r.top, r.bottom]);
      });
      const safe = function (y) {
        const all = blocks.concat(textRows);
        for (let i = 0; i < all.length; i++) {
          const b = all[i];
          if (b[0] < y - 0.5 && b[1] > y + 0.5 && (b[1] - b[0]) < 600) return false;
        }
        return true;
      };
      const candidates = blocks.concat(textRows).map(function (b) { return Math.round(b[1] * 100) / 100; })
        .filter(function (v, i, a) { return a.indexOf(v) === i; }).sort(function (a, b) { return a - b; });

      const pageH = W * 297 / 210;
      const slices = [];
      let start = 0;
      while (start < H - 2) {
        const top = slices.length ? M : 0;
        const usable = pageH - top - M - (foot ? foot.h + 14 : 0);
        let end = start + usable;
        if (end >= H) { end = H; }
        else {
          let best = 0;
          for (let i = 0; i < candidates.length; i++) {
            const c = candidates[i];
            if (c > end) break;
            if (c > start + usable * 0.4 && safe(c)) best = c;
          }
          if (best) end = best;
        }
        slices.push({ y: start, h: end - start, top: top });
        start = end;
      }

      const pdf = new window.jspdf.jsPDF({ unit: 'pt', format: 'a4', compress: true });
      const pw = pdf.internal.pageSize.getWidth();
      const k = pw / W;
      slices.forEach(function (s, i) {
        if (i) pdf.addPage();
        const c = document.createElement('canvas');
        c.width = canvas.width; c.height = Math.max(1, Math.round(s.h * scale));
        const g = c.getContext('2d');
        g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
        g.drawImage(canvas, 0, Math.round(s.y * scale), canvas.width, c.height, 0, 0, c.width, c.height);
        pdf.addImage(c.toDataURL('image/jpeg', 0.93), 'JPEG', 0, s.top * k, pw, s.h * k, undefined, 'FAST');
        const ph = pdf.internal.pageSize.getHeight();
        if (foot) {
          pdf.addImage(foot.canvas.toDataURL('image/jpeg', 0.93), 'JPEG', foot.x * k, ph - (M + foot.h) * k, foot.w * k, foot.h * k, 'foot', 'FAST');
        }
        if (slices.length > 1) {
          pdf.setFontSize(7.5); pdf.setTextColor(150);
          pdf.text('Page ' + (i + 1) + ' of ' + slices.length, pw / 2, ph - 8, { align: 'center' });
        }
      });
      return pdf;
    } finally {
      frame.remove();
    }
  }
};

const Inv = {
  /** Mirrors computeTotals_ in Invoices.gs exactly (the server is final). */
  calc: function (lines, o) {
    let subtotal = 0, lineDisc = 0, lineTax = 0, net = 0;
    const out = lines.map(function (l) {
      const sub = round2(l.Qty * l.UnitPrice);
      const disc = round2(sub * l.DiscountPct / 100);
      const taxable = round2(sub - disc);
      const tax = round2(taxable * l.TaxPct / 100);
      subtotal += sub; lineDisc += disc; lineTax += tax; net += taxable;
      return { sub: sub, disc: disc, tax: tax, total: round2(taxable + tax) };
    });
    subtotal = round2(subtotal); lineDisc = round2(lineDisc); lineTax = round2(lineTax); net = round2(net);
    let invDisc = o.discountType === 'percent' ? round2(net * (Number(o.discountValue) || 0) / 100) : round2(Number(o.discountValue) || 0);
    if (invDisc > net) invDisc = net;
    const factor = net > 0 ? (net - invDisc) / net : 0;
    const taxTotal = round2(lineTax * factor);
    const grand = round2(net - invDisc + taxTotal + (Number(o.additional) || 0) + (Number(o.shipping) || 0));
    return { lines: out, subtotal: subtotal, lineDisc: lineDisc, invDisc: invDisc, tax: taxTotal, grand: grand };
  },

  HISTORY_LABELS: {
    CREATED: 'Invoice created', UPDATED: 'Invoice edited', PAYMENT_ADDED: 'Payment recorded',
    PAYMENT_VOIDED: 'Payment voided', CANCELLED: 'Invoice cancelled', RESTORED: 'Invoice restored',
    DUPLICATED: 'Duplicated', PDF_CREATED: 'PDF generated', SHARED_WHATSAPP: 'Shared on WhatsApp',
    SHARED_EMAIL: 'Sent by email', DELETED: 'Invoice deleted', UNDELETED: 'Restored from deleted',
    CONVERTED: 'Converted to invoice', STATUS_CHANGED: 'Status changed'
  },

  historyText: function (h) {
    const d = h.details || {};
    if (typeof d !== 'object') return esc(String(d));
    switch (h.action) {
      case 'CREATED': return (d.fromQuotation ? 'From quotation ' + esc(d.fromQuotation) + ' &middot; ' : '') +
        (d.duplicatedFrom ? 'Copy of ' + esc(d.duplicatedFrom) + (d.total !== undefined ? ' &middot; ' : '') : '') +
        (d.total !== undefined ? 'Total ' + money(d.total) : '') + (d.advance ? ', advance ' + money(d.advance) : '');
      case 'CONVERTED': return d.invoiceNo ? 'Invoice ' + esc(d.invoiceNo) : '';
      case 'STATUS_CHANGED': return esc(d.from || '') + ' &rarr; ' + esc(d.to || '') + (d.note ? ' &middot; ' + esc(d.note) : '');
      case 'UPDATED': {
        const parts = [];
        if (d.total) parts.push('Total ' + money(d.total[0]) + ' &rarr; ' + money(d.total[1]));
        if (d.customer) parts.push('Customer ' + esc(d.customer[0] || '-') + ' &rarr; ' + esc(d.customer[1]));
        if (d.date) parts.push('Date ' + fmtDate(d.date[0]) + ' &rarr; ' + fmtDate(d.date[1]));
        if (d.dueDate) parts.push('Due ' + fmtDate(d.dueDate[0]) + ' &rarr; ' + fmtDate(d.dueDate[1]));
        return parts.join('<br>') || 'Details updated' + (d.version ? ' (version ' + d.version + ')' : '');
      }
      case 'PAYMENT_ADDED': return money(d.amount) + ' by ' + esc(d.method) + (d.date ? ' on ' + fmtDate(d.date) : '');
      case 'PAYMENT_VOIDED': return money(d.amount) + ' &middot; ' + esc(d.reason || '');
      case 'CANCELLED': return esc(d.reason || '');
      case 'DUPLICATED': return d.newInvoice ? 'Copied to ' + esc(d.newInvoice) : '';
      case 'PDF_CREATED': return esc(d.file || '');
      case 'SHARED_WHATSAPP': return d.phone ? '+' + esc(d.phone) : '';
      case 'SHARED_EMAIL': return esc(d.to || '');
      case 'DELETED': return (d.paymentsVoided ? d.paymentsVoided + ' payment(s) of ' + money(d.amountVoided) + ' voided' : '') + (d.reason ? (d.paymentsVoided ? ' &middot; ' : '') + esc(d.reason) : '');
      case 'UNDELETED': return d.paymentsRestored ? d.paymentsRestored + ' payment(s) brought back' : '';
      default: return '';
    }
  },

  /**
   * Makes sure Drive has a PDF that matches the current preview.
   * Returns { blob, fileName, driveUrl } - blob only when wantBlob and it was built now.
   * Falls back to the server PDF if the browser cannot build one.
   */
  ensurePdf: async function (invoiceId, wantBlob) {
    const r = await API.call('invoices.html', { invoiceId: invoiceId }, { silent: true });
    if (r.pdfReady && !wantBlob) return { ready: true };
    UI.loading(true);
    try {
      const pdf = await PdfMaker.build(r.html);
      const dataUri = pdf.output('datauristring');
      const saved = await API.call('invoices.savePdf', {
        invoiceId: invoiceId, stamp: r.stamp, base64: dataUri.slice(dataUri.indexOf(',') + 1)
      }, { silent: true });
      return { blob: pdf.output('blob'), fileName: saved.fileName, driveUrl: saved.driveUrl };
    } catch (e) {
      console.warn('Browser PDF failed, using server PDF:', e);
      if (e && e.code === 'CONFLICT') throw e;
      return { fallback: true, error: e };
    } finally {
      UI.loading(false);
    }
  },

  /**
   * Invoice logo manager: upload / change / remove the logo printed on
   * invoices, choose its size or hide it. Resolves true when anything changed.
   */
  logoManager: async function () {
    let info = await API.call('settings.logoGet', {});
    let changed = false;
    return new Promise(function (resolve) {
      const m = UI.modal({
        title: 'Invoice logo', noFocus: true,
        onClose: function () { resolve(changed); },
        body: '<div id="lg-box"></div>',
        buttons: [
          { label: 'Close', close: true },
          { label: 'Save', cls: 'btn-primary', icon: 'check', onClick: async function () {
            const size = m.el.querySelector('.seg button.active');
            info = await API.call('settings.logoOptions', {
              logoSize: size ? size.dataset.size : 'M', showLogo: m.el.querySelector('#lg-show').checked
            });
            App.state.settings = info.settings;
            changed = true; UI.toast('Invoice logo settings saved.'); m.close();
          } }
        ]
      });
      const draw = function () {
        const url = info.invoiceLogoDataUrl || info.businessLogoDataUrl;

  /** PDF download modal - uses a real link so pop-up blockers do not interfere. */
  pdf: async function (invoiceId) {
    let r = await Inv.ensurePdf(invoiceId, true);
    let blob = r.blob || null;
    if (!blob) {
      const s = await API.call('invoices.pdf', { invoiceId: invoiceId });
      try {
        const bin = atob(s.base64);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        blob = new Blob([bytes], { type: 'application/pdf' });
      } catch (e) { blob = null; }
      r = { fileName: s.fileName, driveUrl: s.driveUrl, fallback: r.fallback };
      if (r.fallback) UI.toast('The PDF tools could not load, so a simpler server PDF was made. Check your internet and try again for the full design.', 'info', 7000);
    }
    const blobUrl = blob ? URL.createObjectURL(blob) : '';
    UI.modal({
      title: 'PDF ready', size: 'sm', noFocus: true,
      onClose: function () { if (blobUrl) setTimeout(function () { URL.revokeObjectURL(blobUrl); }, 1000); },
      body: '<div class="flex" style="gap:14px;align-items:flex-start"><span class="ico ico-red" style="width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none">' + icon('invoice') + '</span>' +

        '<div style="display:grid;gap:8px;margin-top:18px">' +
        (blobUrl ? '<a class="btn btn-primary btn-block" href="' + blobUrl + '" download="' + esc(r.fileName) + '">' + icon('download') + ' Download PDF</a>' : '') +
        '<a class="btn btn-block" href="' + esc(r.driveUrl) + '" target="_blank" rel="noopener">' + icon('link') + ' Open in Google Drive</a></div>'
    });
  },

        '<span class="hint">Leave empty to choose the contact inside WhatsApp. Local numbers like 0771234567 are converted to +94.</span></div>' +
        '<div class="field mt-2"><label>Message</label><textarea id="wa-msg" style="min-height:220px">' + esc(message) + '</textarea></div>' +

        '<a class="btn btn-wa btn-block btn-lg mt-2" id="wa-go" target="_blank" rel="noopener">' + icon('whatsapp') + ' Open WhatsApp</a>'
    });

    const statuses = [['', 'All statuses'], ['Unpaid', 'Unpaid (pending + partial)'], ['Overdue', 'Overdue'], ['Pending', 'Pending'],

        if (my !== reqId) return;
        sum.innerHTML = '<div class="chips"><span><b>' + cnt(r.summary.count) + '</b> invoices</span><span>Total <b>' + money(r.summary.total) + '</b></span>' +
          '<span>Paid <b>' + money(r.summary.paid) + '</b></span><span>Outstanding <b style="color:var(--danger)">' + money(r.summary.balance) + '</b></span>' +
          (r.truncated ? '<span>Showing the latest ' + r.invoices.length + ' - refine filters to see more</span>' : '') + '</div>';
        if (!r.invoices.length) {
          const filtered = f.q || f.status || f.from || f.to || f.customerId;
          body.innerHTML = filtered ? UI.empty('search', 'No invoices found', 'Try changing the search or filters.')
            : UI.empty('invoice', 'No invoices yet', 'Create your first invoice to get started.', '<button class="btn btn-primary mt-2" data-go="new">' + icon('plus') + ' New invoice</button>');
        } else {
          body.innerHTML = '<div class="table-wrap"><table class="table"><thead><tr><th>Invoice</th><th>Customer</th><th class="hide-sm">Date</th><th class="hide-sm">Due</th>' +
            '<th class="num">Total</th><th class="num hide-sm">Paid</th><th class="num">Balance</th><th>Status</th><th></th></tr></thead><tbody>' +
            r.invoices.map(function (i) {
              return '<tr class="clickable' + (i.Status === 'Cancelled' ? ' t-voided' : '') + '" data-id="' + esc(i.InvoiceId) + '">' +
                '<td class="strong nowrap">' + esc(i.InvoiceNo) + (i.RefNo ? '<div class="small muted">' + esc(i.RefNo) + '</div>' : '') + '</td>' +
                '<td><div class="ellipsis" style="max-width:220px">' + esc(i.CustomerName || '-') + '</div><div class="small muted">' + esc(i.CustomerPhone || '') + '</div></td>' +
                '<td class="hide-sm nowrap">' + fmtDate(i.InvoiceDate) + '</td><td class="hide-sm nowrap">' + fmtDate(i.DueDate) + '</td>' +
                '<td class="num nowrap amount">' + money(i.GrandTotal) + '</td><td class="num nowrap hide-sm">' + money(i.TotalPaid) + '</td>' +
                '<td class="num nowrap strong">' + money(i.Balance) + '</td><td>' + statusBadge(i.Status, i.IsOverdue) + '</td>' +
                '<td class="actions nowrap right">' +
                  (i.Status !== 'Cancelled' && i.Balance > 0 ? '<button class="btn btn-sm btn-ghost btn-icon" title="Record payment" data-pay="' + esc(i.InvoiceId) + '">' + icon('cash') + '</button>' : '') +
                  '<button class="btn btn-sm btn-ghost btn-icon" title="WhatsApp" data-wa="' + esc(i.InvoiceId) + '">' + icon('whatsapp') + '</button>' +
                  '<button class="btn btn-sm btn-ghost btn-icon" title="Download PDF" data-pdf="' + esc(i.InvoiceId) + '">' + icon('download') + '</button>' +
                '</td></tr>';
            }).join('') + '</tbody></table></div>';
        }
        hydrateIcons(el);
      } catch (e) {
        if (my === reqId) body.innerHTML = '<div class="card-body"><div class="alert alert-error">' + icon('alert') + '<div>' + esc(e.message) + '</div></div></div>';
      } finally { body.style.opacity = ''; }
    };

    el.querySelector('#f-q').oninput = debounce(function (e) { f.q = e.target.value.trim(); load(); }, 300);
    el.querySelector('#f-status').onchange = function (e) { f.status = e.target.value; load(); };
    el.querySelector('#f-from').onchange = function (e) { f.from = e.target.value; load(); };
    el.querySelector('#f-to').onchange = function (e) { f.to = e.target.value; load(); };
    el.querySelector('#f-month').onclick = function () {
      f.from = monthStart(); f.to = todayStr();
      el.querySelector('#f-from').value = f.from; el.querySelector('#f-to').value = f.to; load();
    };
    el.querySelector('#f-clear').onclick = function () { App.go('invoices'); };
    el.querySelector('#inv-deleted').onclick = async function () {
      try { if (await Inv.deletedList()) load(); } catch (err) { UI.error(err); }
    };
    const cx = el.querySelector('#f-cust-x');
    if (cx) cx.onclick = function () { App.go('invoices', { status: f.status }); };

    el.onclick = async function (e) {
      if (e.target.closest('[data-go="new"]')) return App.go('invoice-new');
      const pay = e.target.closest('[data-pay]'), wa = e.target.closest('[data-wa]'), pdf = e.target.closest('[data-pdf]');
      try {
        if (pay) { e.stopPropagation(); if (await Payments.record(pay.dataset.pay)) load(); return; }
        if (wa) { e.stopPropagation(); return await Inv.whatsapp(wa.dataset.wa); }
        if (pdf) { e.stopPropagation(); return await Inv.pdf(pdf.dataset.pdf); }
      } catch (err) { return UI.error(err); }
      const row = e.target.closest('tr[data-id]');
      if (row) App.go('invoice-view', { id: row.dataset.id });
    };
    await load();
  }
};

            '<div id="cust-card" class="mt-2"></div></div>' +
          '<div id="cust-temp" class="form-grid hidden">' +
            '<div class="field full"><label>Customer name <span class="req">*</span></label><input type="text" data-tc="CustomerName" maxlength="120" value="' + v(tempCust.CustomerName) + '"></div>' +
            '<div class="field"><label>Phone</label><input type="tel" data-tc="Phone" maxlength="25" value="' + v(tempCust.Phone) + '"></div>' +
            '<div class="field"><label>WhatsApp</label><input type="tel" data-tc="WhatsApp" maxlength="25" value="' + v(tempCust.WhatsApp) + '"></div>' +
            '<div class="field"><label>Email</label><input type="email" data-tc="Email" maxlength="254" value="' + v(tempCust.Email) + '"></div>' +
            '<div class="field"><label>Address</label><input type="text" data-tc="Address" maxlength="500" value="' + v(tempCust.Address) + '"></div>' +
            '<div class="field full"><label class="check"><input type="checkbox" id="tc-save" ' + (isEdit ? '' : 'checked') + '> Save this customer for future invoices and quotations</label></div>' +
          '</div>' +
        '</div></div>' +

      /* details */
      '<div class="card"><div class="card-head"><h2>' + W.Doc + ' details</h2>' + (isEdit ? '<span class="badge badge-pending">' + esc(inv.InvoiceNo) + '</span>' : '<span class="small muted">No. assigned on save</span>') + '</div>' +
        '<div class="card-body"><div class="form-grid g3">' +
          '<div class="field"><label>' + W.date + ' <span class="req">*</span></label><input type="date" id="f-date" value="' + v(inv && inv.InvoiceDate, today) + '"></div>' +
          '<div class="field"><label>' + W.due + '</label><input type="date" id="f-due" value="' + v(inv && inv.DueDate, addDays(today, dueDays)) + '"></div>' +
          '<div class="field"><label>Customer ref / job no.</label><input type="text" id="f-ref" maxlength="60" value="' + v(inv && inv.RefNo) + '"></div>' +
        '</div></div></div>' +

      /* items */
      '<div class="card"><div class="card-head"><h2>Items</h2><span class="small muted">' + (items.length ? items.length + ' saved items available' : 'Tip: save products &amp; services for faster entry') + '</span></div>' +
        '<div class="card-body">' +
          '<div class="lines-head"><div>Item &amp; description</div><div class="right">Qty</div><div class="right">Unit price</div><div class="right">Disc %</div><div class="right">' + esc(taxLabel) + ' %</div><div class="right">Total</div><div></div></div>' +
          '<div id="lines"></div>' +
          '<datalist id="item-dl">' + items.map(function (x) { return '<option value="' + esc(x.ItemName) + '">'; }).join('') + '</datalist>' +
          '<button class="btn mt-2" id="add-line" type="button">' + icon('plus') + ' Add item</button>' +
        '</div></div>' +

      /* notes */
      '<div class="card"><div class="card-head"><h2>Notes &amp; terms</h2></div><div class="card-body"><div class="form-grid">' +
        '<div class="field full"><label>Notes (shown on ' + W.doc + ')</label><textarea id="f-notes" maxlength="2000">' + v(inv && inv.Notes) + '</textarea></div>' +
        '<div class="field full"><label>Terms &amp; conditions</label><textarea id="f-terms" maxlength="3000" style="min-height:100px">' + (inv ? v(inv.Terms) : v(b.DefaultTerms)) + '</textarea></div>' +
        '<div class="field"><label>Template</label><select id="f-tpl">' + templates.map(function (t) {
          return '<option value="' + t.id + '" ' + (t.id === ((inv && inv.TemplateId) || s.templateId) ? 'selected' : '') + '>' + esc(t.name) + '</option>';
        }).join('') + '</select></div>' +
        '<div class="field' + (s.showSignature === 'true' ? '' : ' hidden') + '"><label>Authorized signature name</label><input type="text" id="f-sign" maxlength="80" value="' + (inv ? v(inv.SignatureName) : v(s.signatureName)) + '"></div>' +
      '</div></div></div>' +

      '</div>' +

      /* side: totals */
      '<div class="editor-side"><div class="card"><div class="card-head"><h2>Summary</h2></div><div class="card-body totals-box">' +
        '<div class="row"><span>Subtotal</span><span class="v" id="t-sub"></span></div>' +
        '<div class="row" id="r-ldisc"><span>Item discounts</span><span class="v" id="t-ldisc"></span></div>' +
        '<div class="section-title mt-2" style="margin-bottom:8px">' + W.Doc + ' discount</div>' +
        '<div class="mini-row"><div class="seg" id="disc-seg"><button type="button" data-t="amount">Amount</button><button type="button" data-t="percent">%</button></div>' +
          '<input type="number" id="f-disc" class="num" min="0" step="0.01" value="' + v(inv && inv.InvoiceDiscountValue, '') + '" placeholder="0.00"></div>' +
        '<div class="row" id="r-idisc"><span>Discount</span><span class="v" id="t-idisc"></span></div>' +
        '<div class="row"><span>' + esc(taxLabel) + '</span><span class="v" id="t-tax"></span></div>' +
        '<div class="section-title mt-2" style="margin-bottom:8px">Other charges</div>' +
        '<div class="mini-row"><input type="text" id="f-addl-label" maxlength="60" placeholder="Additional charges" value="' + v(inv && inv.AdditionalChargesLabel) + '">' +
          '<input type="number" id="f-addl" class="num" min="0" step="0.01" placeholder="0.00" value="' + v(inv && inv.AdditionalCharges, '') + '"></div>' +
        '<div class="mini-row"><span class="small" style="padding-left:2px">Shipping / delivery</span>' +
          '<input type="number" id="f-ship" class="num" min="0" step="0.01" placeholder="0.00" value="' + v(inv && inv.ShippingCharges, '') + '"></div>' +
        '<div class="row grand"><span>Grand total</span><span class="v" id="t-grand"></span></div>' +
        (isQ
          ? '<div class="small muted mt-1">When the customer agrees, open the quotation and click <b>Convert to invoice</b>. Payments are recorded on the invoice.</div>'
          : isEdit
          ? '<div class="row"><span>Already paid</span><span class="v">' + money(inv.TotalPaid) + '</span></div>' +
            '<div class="row bal"><span>Balance</span><span class="v" id="t-bal"></span></div>' +
            '<div class="small muted mt-1">Record payments from the invoice page.</div>'
          : '<div class="section-title mt-2" style="margin-bottom:8px">Advance payment</div>' +
            '<div class="mini-row"><select id="f-method"><option value="">Payment method</option>' + methods.map(function (m) { return '<option>' + esc(m) + '</option>'; }).join('') + '</select>' +
              '<input type="number" id="f-adv" class="num" min="0" step="0.01" placeholder="0.00"></div>' +
            '<div class="row"><span>Paid now</span><span class="v" id="t-paid"></span></div>' +
            '<div class="row bal"><span>Balance due</span><span class="v" id="t-bal"></span></div>' +
            '<div class="row"><span>Status</span><span id="t-status"></span></div>') +
      '</div></div>' +
      '<button class="btn btn-primary btn-lg btn-block" id="ed-save2">' + icon('check') + ' Save ' + W.doc + '</button></div>' +
      '</div>';

    const $ = function (sel) { return el.querySelector(sel); };
    const linesEl = $('#lines');

    /* ---------- customer ---------- */
    const setCustMode = function (mode) {
      st.custMode = mode;
      el.querySelectorAll('#cust-seg button').forEach(function (x) { x.classList.toggle('active', x.dataset.mode === mode); });
      $('#cust-saved').classList.toggle('hidden', mode !== 'saved');
      $('#cust-temp').classList.toggle('hidden', mode !== 'temp');
    };
    const showCustCard = function () {
      const c = customers.filter(function (x) { return x.CustomerId === st.customerId; })[0];
      $('#cust-card').innerHTML = c
        ? '<div class="cust-card flex" style="align-items:flex-start"><div class="grow"><div style="font-weight:600">' + esc(c.CustomerName) + '</div>' +
          '<div class="muted">' + [c.Phone, c.Email].filter(Boolean).map(esc).join(' &middot; ') + '</div>' +
          (c.Address ? '<div class="muted">' + nl2br(c.Address) + '</div>' : '') +
          (c.TotalBalance > 0 ? '<div class="mt-1" style="color:var(--danger);font-weight:600">Outstanding: ' + money(c.TotalBalance) + '</div>' : '') +
          '</div><button class="btn btn-sm btn-ghost btn-icon" id="cust-clear" title="Change customer">' + icon('x') + '</button></div>'
        : '<div class="small muted">No customer selected. ' + (customers.length ? 'Search above, or ' : '') + '<a href="#" id="cust-new-link">add a new customer</a>.</div>';
      const clr = $('#cust-clear');
      if (clr) clr.onclick = function () { st.customerId = ''; $('#cust-search').value = ''; showCustCard(); $('#cust-search').focus(); };
      const nl = $('#cust-new-link');
      if (nl) nl.onclick = function (e) { e.preventDefault(); setCustMode('temp'); };
    };
    el.querySelectorAll('#cust-seg button').forEach(function (x) { x.onclick = function () { setCustMode(x.dataset.mode); st.dirty = true; }; });
    $('#cust-search').oninput = function (e) {
      const val = e.target.value.trim();
      const hit = customers.filter(function (c) { return custLabel(c) === val; })[0] ||
        customers.filter(function (c) { return c.CustomerName.toLowerCase() === val.toLowerCase(); })[0];
      if (hit) { st.customerId = hit.CustomerId; st.dirty = true; showCustCard(); }
    };
    const preCust = customers.filter(function (c) { return c.CustomerId === st.customerId; })[0];
    if (preCust) $('#cust-search').value = custLabel(preCust);
    setCustMode(st.custMode);
    showCustCard();

    /* ---------- lines ---------- */
    const lineHtml = function (l, i) {
      return '<div class="line" data-i="' + i + '">' +
        '<div class="c-name"><span class="mlabel">Item ' + (i + 1) + '</span><input type="text" data-f="ItemName" list="item-dl" maxlength="120" placeholder="Item or service name" value="' + v(l.ItemName) + '" autocomplete="off">' +
          '<textarea data-f="Description" maxlength="1000" placeholder="Description (optional)">' + v(l.Description) + '</textarea></div>' +
        '<div><span class="mlabel">Qty' + (l.Unit ? ' (' + esc(l.Unit) + ')' : '') + '</span><input type="number" class="num" data-f="Qty" min="0" step="any" value="' + v(l.Qty, 1) + '"></div>' +
        '<div><span class="mlabel">Unit price</span><input type="number" class="num" data-f="UnitPrice" min="0" step="0.01" value="' + v(l.UnitPrice, 0) + '"></div>' +
        '<div><span class="mlabel">Disc %</span><input type="number" class="num" data-f="DiscountPct" min="0" max="100" step="0.01" value="' + v(l.DiscountPct, 0) + '"></div>' +
        '<div><span class="mlabel">' + esc(taxLabel) + ' %</span><input type="number" class="num" data-f="TaxPct" min="0" max="100" step="0.01" value="' + v(l.TaxPct, 0) + '"></div>' +
        '<div class="c-total"><span class="mlabel">Total</span><div class="ltotal" data-total></div></div>' +
        '<div class="c-del"><button type="button" class="btn btn-ghost btn-icon btn-sm" data-del title="Remove item">' + icon('trash') + '</button></div>' +
      '</div>';
    };
    const renderLines = function () {
      linesEl.innerHTML = st.lines.map(lineHtml).join('');
      hydrateIcons(linesEl);
      recalc();
    };
    const numVal = function (x) { const n = parseFloat(x); return isFinite(n) ? n : 0; };

    linesEl.oninput = function (e) {
      const row = e.target.closest('.line'); if (!row) return;
      const l = st.lines[+row.dataset.i], f = e.target.dataset.f;
      st.dirty = true;
      if (f === 'ItemName') {
        l.ItemName = e.target.value;
        const hit = items.filter(function (x) { return x.ItemName === e.target.value; })[0];
        if (hit) {
          l.ItemId = hit.ItemId; l.UnitPrice = hit.UnitPrice; l.TaxPct = hit.TaxPct; l.Unit = hit.Unit;
          if (!l.Description) l.Description = hit.Description;
          row.querySelector('[data-f=UnitPrice]').value = hit.UnitPrice;
          row.querySelector('[data-f=TaxPct]').value = hit.TaxPct;
          row.querySelector('[data-f=Description]').value = l.Description;
        } else if (l.ItemId) {
          const was = items.filter(function (x) { return x.ItemId === l.ItemId; })[0];
          if (!was || was.ItemName !== l.ItemName) l.ItemId = '';
        }
      } else if (f === 'Description') {
        l.Description = e.target.value;
      } else if (f) {
        l[f] = numVal(e.target.value);
      }
      recalc();
    };
    linesEl.onclick = function (e) {
      const d = e.target.closest('[data-del]'); if (!d) return;
      const i = +d.closest('.line').dataset.i;
      if (st.lines.length === 1) {
        st.lines[0] = { ItemId: '', ItemName: '', Description: '', Qty: 1, Unit: '', UnitPrice: 0, DiscountPct: 0, TaxPct: 0 };
      } else st.lines.splice(i, 1);
      st.dirty = true;
      renderLines();
    };
    $('#add-line').onclick = function () {
      st.lines.push({ ItemId: '', ItemName: '', Description: '', Qty: 1, Unit: '', UnitPrice: 0, DiscountPct: 0, TaxPct: 0 });
      renderLines();
      const last = linesEl.querySelector('.line:last-child [data-f=ItemName]'); if (last) last.focus();
    };

    /* ---------- totals ---------- */
    const setDiscType = function (t) {
      st.discType = t;
      el.querySelectorAll('#disc-seg button').forEach(function (x) { x.classList.toggle('active', x.dataset.t === t); });
      $('#f-disc').max = t === 'percent' ? 100 : '';
      recalc();
    };
    el.querySelectorAll('#disc-seg button').forEach(function (x) { x.onclick = function () { st.dirty = true; setDiscType(x.dataset.t); }; });

    function recalc() {
      const t = Inv.calc(st.lines, {
        discountType: st.discType, discountValue: numVal($('#f-disc').value),
        additional: numVal($('#f-addl').value), shipping: numVal($('#f-ship').value)
      });
      linesEl.querySelectorAll('.line').forEach(function (row, i) { row.querySelector('[data-total]').textContent = money(t.lines[i].total); });
      $('#t-sub').textContent = money(t.subtotal);
      $('#t-ldisc').textContent = '- ' + money(t.lineDisc);
      $('#r-ldisc').classList.toggle('hidden', !t.lineDisc);
      $('#t-idisc').textContent = '- ' + money(t.invDisc);
      $('#r-idisc').classList.toggle('hidden', !t.invDisc);
      $('#t-tax').textContent = money(t.tax);
      $('#t-grand').textContent = money(t.grand);
      if (isQ) {
        // quotations have no payments
      } else if (isEdit) {
        const bal = round2(t.grand - inv.TotalPaid);
        $('#t-bal').textContent = money(bal);
        $('#t-bal').style.color = bal < 0 ? 'var(--danger)' : '';
      } else {
        const adv = numVal($('#f-adv').value);
        $('#t-paid').textContent = money(adv);
        $('#t-bal').textContent = money(Math.max(0, round2(t.grand - adv)));
        const status = (t.grand <= 0 || adv >= t.grand) ? 'Paid' : adv > 0 ? 'Partially Paid' : 'Pending';
        $('#t-status').innerHTML = statusBadge(status);
      }
      st.totals = t;
    }
    ['#f-disc', '#f-addl', '#f-ship', '#f-adv'].forEach(function (sel) {
      const x = $(sel); if (x) x.addEventListener('input', function () { st.dirty = true; recalc(); });
    });
    $('#f-date').onchange = function () {
      st.dirty = true;
      if (!st.dueTouched && this.value) $('#f-due').value = addDays(this.value, dueDays);
    };
    $('#f-due').onchange = function () { st.dueTouched = true; st.dirty = true; };
    el.querySelectorAll('#cust-temp input, #f-ref, #f-notes, #f-terms, #f-sign, #f-addl-label').forEach(function (x) {
      x.addEventListener('input', function () { st.dirty = true; });
    });

    setDiscType(st.discType);
    renderLines();

    /* ---------- save ---------- */
    const collect = function () {
      const lines = st.lines.filter(function (l) { return String(l.ItemName || '').trim() || l.UnitPrice; });
      if (!lines.length) throw new Error('Add at least one item.');
      lines.forEach(function (l, i) {
        if (!String(l.ItemName || '').trim()) throw new Error('Item ' + (i + 1) + ' needs a name.');
        if (!(Number(l.Qty) > 0)) throw new Error('Item ' + (i + 1) + ' quantity must be more than 0.');
      });
      let customer;
      if (st.custMode === 'saved') {
        if (!st.customerId) throw new Error('Select a customer, or switch to "New / one-time".');
        customer = { mode: 'saved', CustomerId: st.customerId };
      } else {
        customer = { mode: 'temp', saveCustomer: $('#tc-save').checked };
        el.querySelectorAll('[data-tc]').forEach(function (x) { customer[x.dataset.tc] = x.value; });
        if (!customer.CustomerName.trim()) throw new Error('Enter the customer name.');
      }
      const date = $('#f-date').value, due = $('#f-due').value;
      if (!date) throw new Error('Select the ' + W.date.toLowerCase() + '.');
      if (due && due < date) throw new Error(W.due + ' cannot be before the ' + W.date.toLowerCase() + '.');
      if (st.totals.grand < 0) throw new Error('Grand total cannot be negative.');
      const out = {
        InvoiceDate: date, DueDate: due, RefNo: $('#f-ref').value, customer: customer,
        lines: lines.map(function (l) {
          return { ItemId: l.ItemId || '', ItemName: l.ItemName, Description: l.Description, Qty: l.Qty, Unit: l.Unit || '', UnitPrice: l.UnitPrice, DiscountPct: l.DiscountPct, TaxPct: l.TaxPct };
        }),
        InvoiceDiscountType: st.discType, InvoiceDiscountValue: numVal($('#f-disc').value),
        AdditionalChargesLabel: $('#f-addl-label').value, AdditionalCharges: numVal($('#f-addl').value),
        ShippingCharges: numVal($('#f-ship').value),
        Notes: $('#f-notes').value, Terms: $('#f-terms').value, TemplateId: $('#f-tpl').value, SignatureName: $('#f-sign').value
      };
      if (isQ) {
        if (isEdit) out.QuoteId = inv.InvoiceId;
      } else if (isEdit) {
        out.InvoiceId = inv.InvoiceId;
        out.PaymentMethod = inv.PaymentMethod || '';
        if (st.totals.grand < inv.TotalPaid) throw new Error('The new total is less than the amount already paid (' + money(inv.TotalPaid) + '). Void a payment first.');
      } else {
        const adv = numVal($('#f-adv').value);
        out.AdvancePayment = adv;
        out.PaymentMethod = $('#f-method').value;
        if (adv < 0) throw new Error('Advance payment cannot be negative.');
        if (adv > st.totals.grand) throw new Error('Advance payment cannot be more than the grand total.');
        if (adv > 0 && !out.PaymentMethod) throw new Error('Select the payment method for the advance payment.');
      }
      return out;
    };

    let saving = false;
    const save = async function () {
      if (saving) return;
      let data;
      try { data = collect(); } catch (e) { return UI.toast(e.message, 'error'); }
      saving = true;
      el.querySelectorAll('#ed-save, #ed-save2').forEach(function (x) { x.disabled = true; });
      try {
        App.invalidate('customers');
        st.dirty = false;
        if (isQ) {
          const r = await API.call('quotations.save', { quotation: data });
          UI.toast((isEdit ? 'Saved ' : 'Created ') + r.QuoteNo + '.');
          App.go('quotation-view', { id: r.QuoteId });
        } else {
          const r = await API.call('invoices.save', { invoice: data });
          UI.toast((isEdit ? 'Saved ' : 'Created ') + r.InvoiceNo + '.');
          App.go('invoice-view', { id: r.InvoiceId });
        }
      } catch (e) {
        UI.error(e);
      } finally {
        saving = false;
        el.querySelectorAll('#ed-save, #ed-save2').forEach(function (x) { x.disabled = false; });
      }
    };
    $('#ed-save').onclick = save;
    $('#ed-save2').onclick = save;
    $('#ed-cancel').onclick = async function () {
      if (st.dirty && !await UI.confirm({ title: 'Discard changes', message: 'You have unsaved changes. Leave without saving?', confirmText: 'Discard', danger: true })) return;
      if (isQ) { if (isEdit) App.go('quotation-view', { id: inv.InvoiceId }); else App.go('quotations'); return; }
      if (isEdit) App.go('invoice-view', { id: inv.InvoiceId }); else App.go('invoices');
    };
  }
};

App.pages['invoice-new'] = { title: 'New Invoice', render: function (el, p) { return InvoiceEditor.render(el, { customerId: p.customerId }); } };
App.pages['invoice-edit'] = { title: 'Edit Invoice', nav: 'invoices', render: function (el, p) { return InvoiceEditor.render(el, { id: p.id }); } };

/* =========================================================
   INVOICE VIEW
   ========================================================= */
App.pages['invoice-view'] = {
  title: 'Invoice',
  nav: 'invoices',
  render: async function (el, params) {
    if (!params.id) return App.go('invoices');
    const res = await Promise.all([
      API.call('invoices.get', { invoiceId: params.id }, { silent: true }),
      API.call('invoices.html', { invoiceId: params.id }, { silent: true })
    ]);
    const full = res[0], html = res[1].html, hasLogo = res[1].hasLogo;
    const inv = full.invoice, cust = full.customer || {};
    const cancelled = inv.Status === 'Cancelled';
    const reload = function () { App.go('invoice-view', { id: inv.InvoiceId }); };
    document.getElementById('topbar-title').textContent = inv.InvoiceNo;

    const pays = full.payments;
    const payHtml = pays.length ? pays.map(function (p) {
      return '<div class="pay-item' + (p.IsVoided ? ' t-voided" style="opacity:.6' : '') + '">' +
        '<span class="ico ' + (p.IsVoided ? 'ico-red' : 'ico-green') + '" style="width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:none">' + icon(p.IsVoided ? 'ban' : 'cash') + '</span>' +
        '<div class="grow" style="min-width:0"><div class="flex" style="justify-content:space-between"><b' + (p.IsVoided ? ' style="text-decoration:line-through"' : '') + '>' + money(p.Amount) + '</b>' +
          (p.IsVoided ? '<span class="badge badge-voided">Voided</span>' : cancelled ? '' : '<button class="btn btn-sm btn-ghost" data-void="' + esc(p.PaymentId) + '" title="Void payment">Void</button>') + '</div>' +
          '<div class="small muted">' + fmtDate(p.PaymentDate) + ' &middot; ' + esc(p.Method) + (p.IsAdvance ? ' &middot; Advance' : '') + (p.Reference ? ' &middot; Ref ' + esc(p.Reference) : '') + '</div>' +
          (p.Notes && !p.IsAdvance ? '<div class="small">' + esc(p.Notes) + '</div>' : '') +
          (p.IsVoided && p.VoidReason ? '<div class="small" style="color:var(--danger)">Reason: ' + esc(p.VoidReason) + '</div>' : '') +
        '</div></div>';
    }).join('') : '<div class="small muted">No payments recorded yet.</div>';

    const histHtml = full.history.length ? '<ul class="timeline">' + full.history.map(function (h) {
      const extra = Inv.historyText(h);
      return '<li><div style="font-weight:600">' + esc(Inv.HISTORY_LABELS[h.action] || h.action) + '</div>' +
        (extra ? '<div class="small">' + extra + '</div>' : '') +
        '<div class="when">' + fmtDateTime(h.at) + (h.by ? ' &middot; ' + esc(h.by) : '') + '</div></li>';
    }).join('') + '</ul>' : '<div class="small muted">No history yet.</div>';

    el.innerHTML =
      '<div class="page-head"><div><div class="flex" style="gap:10px"><button class="btn btn-ghost btn-icon" id="v-back" title="Back to invoices">' + icon('back') + '</button>' +
        '<h1>' + esc(inv.InvoiceNo) + '</h1>' + statusBadge(inv.Status, inv.IsOverdue) + '</div>' +
        '<p>' + esc(cust.CustomerName || '-') + ' &middot; ' + fmtDate(inv.InvoiceDate) + (inv.RefNo ? ' &middot; Ref ' + esc(inv.RefNo) : '') +
          (full.sourceQuote ? ' &middot; From quotation ' + (full.sourceQuote.IsDeleted ? esc(full.sourceQuote.QuoteNo) + ' (deleted)'
            : '<a href="#" data-a="quote" style="font-weight:600">' + esc(full.sourceQuote.QuoteNo) + '</a>') : '') + '</p></div>' +
      '<div class="actions">' +
        (!cancelled && inv.Balance > 0 ? '<button class="btn btn-success" data-a="pay">' + icon('cash') + ' Record payment</button>' : '') +
        '<button class="btn btn-wa" data-a="wa">' + icon('whatsapp') + '<span class="hide-sm"> WhatsApp</span></button>' +
      '</div></div>' +

      '<div class="card" style="margin-bottom:16px"><div class="card-body toolbar">' +
        (!cancelled ? '<button class="btn btn-sm" data-a="edit">' + icon('edit') + ' Edit</button>' : '') +
        '<button class="btn btn-sm" data-a="preview">' + icon('eye') + ' Preview</button>' +
        '<button class="btn btn-sm" data-a="pdf">' + icon('download') + ' Download PDF</button>' +
        '<button class="btn btn-sm" data-a="print">' + icon('print') + ' Print</button>' +
        '<button class="btn btn-sm" data-a="email">' + icon('mail') + ' Email</button>' +
        '<button class="btn btn-sm" data-a="logo">' + icon('upload') + ' Logo</button>' +
        '<button class="btn btn-sm" data-a="dup">' + icon('copy') + ' Duplicate</button>' +
        (cancelled ? '<button class="btn btn-sm" data-a="restore">' + icon('refresh') + ' Restore</button>'
                   : '<button class="btn btn-sm btn-soft-danger" data-a="cancel">' + icon('ban') + ' Cancel invoice</button>') +
        '<button class="btn btn-sm btn-soft-danger" data-a="delete">' + icon('trash') + ' Delete</button>' +
      '</div></div>' +

      (!hasLogo ? '<div class="alert alert-info" style="margin-bottom:16px;align-items:center">' + icon('info') + '<div class="grow">This invoice has no logo. Add your logo so it appears on the invoice, PDF and print.</div><button class="btn btn-sm btn-primary" data-a="logo">' + icon('upload') + ' Add logo</button></div>' : '') +
      (cancelled ? '<div class="alert alert-warn" style="margin-bottom:16px">' + icon('alert') + '<div>This invoice is cancelled. It is excluded from sales totals. Restore it to edit or take payments.</div></div>' : '') +

      '<div class="view-grid"><div class="card preview-wrap"><iframe class="preview-frame" id="v-frame" title="Invoice"></iframe></div>' +
      '<div style="display:grid;gap:16px">' +
        '<div class="card"><div class="card-head"><h2>Summary</h2></div><div class="card-body">' +
          '<div class="sum-row"><span>Grand total</span><span class="v">' + money(inv.GrandTotal) + '</span></div>' +
          '<div class="sum-row"><span>Paid</span><span class="v" style="color:var(--success)">' + money(inv.TotalPaid) + '</span></div>' +
          '<div class="sum-row" style="border-top:1px solid var(--border);margin-top:4px;padding-top:10px"><span style="font-weight:600">Balance</span><span class="v" style="font-size:16px;color:' + (inv.Balance > 0 ? 'var(--danger)' : 'var(--success)') + '">' + money(inv.Balance) + '</span></div>' +
          '<div class="sum-row"><span>Due date</span><span class="v">' + fmtDate(inv.DueDate) + '</span></div>' +
          (inv.PaymentMethod ? '<div class="sum-row"><span>Payment method</span><span class="v">' + esc(inv.PaymentMethod) + '</span></div>' : '') +
          '<div class="cust-card mt-2"><div style="font-weight:600">' + esc(cust.CustomerName || '-') + '</div>' +
            '<div class="muted">' + [cust.Phone, cust.Email].filter(Boolean).map(esc).join(' &middot; ') + '</div>' +
            (inv.CustomerId ? '' : '<div class="small muted mt-1">One-time customer</div>') + '</div>' +
        '</div></div>' +
        '<div class="card"><div class="card-head"><h2>Payments</h2>' + (!cancelled && inv.Balance > 0 ? '<button class="btn btn-sm btn-ghost" data-a="pay">' + icon('plus') + ' Add</button>' : '') + '</div><div class="card-body" style="padding-top:6px;padding-bottom:6px">' + payHtml + '</div></div>' +
        '<div class="card"><div class="card-head"><h2>History</h2></div><div class="card-body">' + histHtml + '</div></div>' +
      '</div></div>';

    const frame = el.querySelector('#v-frame');
    const wrap = frame.parentNode;
    const fit = function () {
      try {
        const docH = frame.contentDocument.documentElement.scrollHeight + 20;
        const avail = wrap.clientWidth;
        const base = 860;
        if (avail < base) {
          const k = avail / base;
          frame.style.width = base + 'px';
          frame.style.height = docH + 'px';
          frame.style.transform = 'scale(' + k + ')';
          wrap.style.height = Math.ceil(docH * k) + 'px';
        } else {
          frame.style.width = ''; frame.style.transform = ''; wrap.style.height = '';
          frame.style.height = Math.max(700, docH) + 'px';
        }
      } catch (e) { /* ignore */ }
    };
    frame.onload = fit;
    frame.srcdoc = html;
    const onResize = debounce(function () { if (!document.body.contains(frame)) return window.removeEventListener('resize', onResize); fit(); }, 150);
    window.addEventListener('resize', onResize);

    el.querySelector('#v-back').onclick = function () { App.go('invoices'); };
    el.onclick = async function (e) {
      const vd = e.target.closest('[data-void]');
      const a = e.target.closest('[data-a]');
      try {
        if (vd) { if (await Payments.voidPayment(vd.dataset.void)) reload(); return; }
        if (!a) return;
        switch (a.dataset.a) {
          case 'pay': if (await Payments.record(inv.InvoiceId)) reload(); break;
          case 'wa': await Inv.whatsapp(inv.InvoiceId); break;
          case 'edit': App.go('invoice-edit', { id: inv.InvoiceId }); break;
          case 'quote': e.preventDefault(); App.go('quotation-view', { id: full.sourceQuote.QuoteId }); break;
          case 'preview': await Inv.preview(inv.InvoiceId); break;
          case 'pdf': await Inv.pdf(inv.InvoiceId); break;
          case 'print': UI.printHtml(html); break;
          case 'delete': if (await Inv.remove(inv)) App.go('invoices'); break;
          case 'logo': if (await Inv.logoManager()) reload(); break;
          case 'email': if (await Inv.email(inv.InvoiceId, inv, cust)) reload(); break;
          case 'dup': await Inv.duplicate(inv.InvoiceId, inv.InvoiceNo); break;
          case 'cancel': {
            const reason = await UI.prompt({ title: 'Cancel ' + inv.InvoiceNo, danger: true, confirmText: 'Cancel invoice', multiline: true,
              message: 'The invoice is kept for your records but excluded from sales.' + (inv.TotalPaid > 0 ? ' <b>Note:</b> ' + money(inv.TotalPaid) + ' has been paid on this invoice.' : ''),
              label: 'Reason', placeholder: 'e.g. Customer cancelled the order' });
            if (reason === null) return;
            await API.call('invoices.cancel', { invoiceId: inv.InvoiceId, reason: reason });
            UI.toast('Invoice cancelled.'); reload(); break;
          }
          case 'restore':
            if (!await UI.confirm({ title: 'Restore invoice', message: 'Restore ' + inv.InvoiceNo + '? Its status will be recalculated from payments.', confirmText: 'Restore' })) return;
            await API.call('invoices.restore', { invoiceId: inv.InvoiceId });
            UI.toast('Invoice restored.'); reload(); break;
        }
      } catch (err) { UI.error(err); }
    };
  }
};
</script>

  <script>
/* ============================================================
   DacaBilling - JS_Quotations.html   (Update 4)
   Quotation list & search, view with preview, PDF, print,
   WhatsApp, email, accept / decline, duplicate, delete /
   restore, and "Convert to invoice".
   The editor is shared with invoices (InvoiceEditor in
   JS_Invoices.html) and so are PDF / WhatsApp / email.
   ============================================================ */
const Quotes = {
  STATUSES: [['', 'All statuses'], ['Active', 'Active (open + accepted)'], ['Open', 'Open'], ['Accepted', 'Accepted'],
    ['Converted', 'Converted to invoice'], ['Declined', 'Declined'], ['Expired', 'Expired']],

  HISTORY_LABELS: {
    CREATED: 'Quotation created', UPDATED: 'Quotation edited', STATUS_CHANGED: 'Status changed',
    CONVERTED: 'Converted to invoice', DUPLICATED: 'Duplicated', PDF_CREATED: 'PDF generated',
    SHARED_WHATSAPP: 'Shared on WhatsApp', SHARED_EMAIL: 'Sent by email',
    DELETED: 'Quotation deleted', UNDELETED: 'Restored from deleted'
  },

  /**
   * Convert dialog: invoice date, due date, optional advance payment.
   * Resolves to { InvoiceId, InvoiceNo } or null.
   */
  convert: function (q, status) {
    const s = App.state.settings || {}, lists = App.state.lists || {};
    const methods = lists.paymentMethods || ['Cash', 'Bank Transfer', 'Card', 'Cheque', 'Online Payment', 'Other'];
    const today = todayStr();
    const dueDays = Number(s.defaultDueDays) || 0;
    return new Promise(function (resolve) {
      let result = null;
      const warn = status === 'Declined'
        ? '<div class="alert alert-warn mt-2">' + icon('alert') + '<div>This quotation is marked as <b>Declined</b>. Convert it only if the customer changed their mind.</div></div>'
        : status === 'Expired'
        ? '<div class="alert alert-warn mt-2">' + icon('alert') + '<div>This quotation expired on <b>' + fmtDate(q.DueDate) + '</b>. Check that the prices are still correct.</div></div>'
        : '';
      const m = UI.modal({
        title: 'Convert ' + q.InvoiceNo + ' to invoice',
        onClose: function () { resolve(result); },
        body: '<p style="margin:0">A new invoice is created with the same customer, items, discounts, charges, notes and terms. The quotation stays for your records and is marked <b>Converted</b>.</p>' +
          warn +
          '<div class="cust-card mt-2 flex" style="justify-content:space-between"><span>Invoice total</span><b>' + money(q.GrandTotal) + '</b></div>' +
          '<div class="form-grid mt-2">' +
            '<div class="field"><label>Invoice date <span class="req">*</span></label><input type="date" id="cv-date" value="' + today + '"></div>' +
            '<div class="field"><label>Due date</label><input type="date" id="cv-due" value="' + addDays(today, dueDays) + '"></div>' +
            '<div class="field"><label>Advance payment (optional)</label><input type="number" id="cv-adv" class="num" min="0" step="0.01" placeholder="0.00"></div>' +
            '<div class="field"><label>Payment method</label><select id="cv-method"><option value="">Select</option>' +
              methods.map(function (x) { return '<option>' + esc(x) + '</option>'; }).join('') + '</select></div>' +
          '</div>' +
          '<div class="small muted mt-2">You can still edit the invoice after it is created.</div>',
        buttons: [
          { label: 'Cancel', close: true },
          { label: 'Create invoice', cls: 'btn-primary', icon: 'invoice', onClick: async function (mm) {
            const $ = function (x) { return mm.el.querySelector(x); };
            const date = $('#cv-date').value, due = $('#cv-due').value;
            const adv = parseFloat($('#cv-adv').value) || 0, method = $('#cv-method').value;
            if (!date) throw new Error('Select the invoice date.');
            if (due && due < date) throw new Error('Due date cannot be before the invoice date.');
            if (adv < 0) throw new Error('Advance payment cannot be negative.');
            if (adv > q.GrandTotal) throw new Error('Advance payment cannot be more than the total.');
            if (adv > 0 && !method) throw new Error('Select the payment method for the advance payment.');
            result = await API.call('quotations.convert', {
              quoteId: q.InvoiceId, InvoiceDate: date, DueDate: due, AdvancePayment: adv, PaymentMethod: method
            });
            App.invalidate();
            UI.toast('Invoice ' + result.InvoiceNo + ' created from ' + q.InvoiceNo + '.');
            mm.close();
          } }
        ]
      });
      const dateEl = m.el.querySelector('#cv-date'), dueEl = m.el.querySelector('#cv-due');
      let dueTouched = false;
      dueEl.onchange = function () { dueTouched = true; };
      dateEl.onchange = function () { if (!dueTouched && dateEl.value) dueEl.value = addDays(dateEl.value, dueDays); };
    });
  },

  setStatus: async function (q, to) {
    const labels = { Accepted: 'Mark as accepted', Declined: 'Mark as declined', Open: 'Re-open quotation' };
    let note = '';
    if (to === 'Declined') {
      note = await UI.prompt({ title: 'Decline ' + q.InvoiceNo, label: 'Reason (optional)', required: false, multiline: true,
        confirmText: 'Mark as declined', danger: true, placeholder: 'e.g. Customer chose another supplier' });
      if (note === null) return false;
    } else if (!await UI.confirm({ title: labels[to], confirmText: labels[to],
      message: to === 'Accepted' ? 'Mark ' + q.InvoiceNo + ' as accepted by the customer? You can convert it to an invoice any time.'
                                 : 'Re-open ' + q.InvoiceNo + '? Its status goes back to Open.' })) return false;
    await API.call('quotations.setStatus', { quoteId: q.InvoiceId, status: to, note: note });
    UI.toast(q.InvoiceNo + ': ' + (to === 'Open' ? 're-opened' : to.toLowerCase()) + '.');
    return true;
  },

  duplicate: async function (q) {
    if (!await UI.confirm({ title: 'Duplicate quotation', confirmText: 'Duplicate',
      message: 'Create a new quotation with the same customer and items as ' + q.InvoiceNo + '? It gets a new number and today\'s date.' })) return;
    const r = await API.call('quotations.duplicate', { quoteId: q.InvoiceId });
    UI.toast('Created ' + r.QuoteNo + '.');
    App.go('quotation-edit', { id: r.QuoteId });
  },

  /** One-click delete with "Undo" (Update 5). */
  remove: async function (q) {
    await API.call('quotations.delete', { quoteId: q.InvoiceId });
    App.invalidate();
    UI.toast(q.InvoiceNo + ' deleted.', 'success', 0, {
      label: 'Undo',
      onClick: async function () {
        await API.call('quotations.undelete', { quoteId: q.InvoiceId });
        App.invalidate();
        UI.toast(q.InvoiceNo + ' restored.');
        App.go('quotation-view', { id: q.InvoiceId });
      }
    });
    return true;
  },

  deletedList: async function () {
    let list = await API.call('quotations.deleted', {});
    let changed = false;
    return new Promise(function (resolve) {
      const m = UI.modal({
        title: 'Deleted quotations', size: 'lg', noFocus: true,
        onClose: function () { resolve(changed); },
        body: '<div id="qdel-list"></div>',
        buttons: [{ label: 'Close', close: true }]
      });
      const draw = function () {
        const box = m.el.querySelector('#qdel-list');
        box.innerHTML = !list.length
          ? UI.empty('trash', 'No deleted quotations', 'Quotations you delete will appear here so you can restore them.')
          : '<div class="table-wrap"><table class="table"><thead><tr><th>Quotation</th><th>Customer</th><th class="hide-sm">Date</th><th class="num">Total</th><th class="hide-sm">Deleted</th><th></th></tr></thead><tbody>' +
            list.map(function (q) {
              return '<tr><td class="strong nowrap">' + esc(q.QuoteNo) + '</td><td>' + esc(q.CustomerName || '-') + '</td>' +
                '<td class="hide-sm nowrap">' + fmtDate(q.QuoteDate) + '</td><td class="num nowrap">' + money(q.GrandTotal) + '</td>' +
                '<td class="hide-sm nowrap small muted">' + fmtDateTime(q.DeletedAt) + '</td>' +
                '<td class="right"><button class="btn btn-sm" data-undel="' + esc(q.QuoteId) + '">' + icon('refresh') + ' Restore</button></td></tr>';
            }).join('') + '</tbody></table></div>';
        hydrateIcons(box);
        box.querySelectorAll('[data-undel]').forEach(function (b) {
          b.onclick = async function () {
            b.disabled = true;
            try {
              const r = await API.call('quotations.undelete', { quoteId: b.dataset.undel });
              list = list.filter(function (x) { return x.QuoteId !== b.dataset.undel; });
              changed = true; UI.toast(r.QuoteNo + ' restored.'); draw();
            } catch (err) { b.disabled = false; UI.error(err); }
          };
        });
      };
      draw();
    });
  }
};

/* =========================================================
   QUOTATION LIST
   ========================================================= */
App.pages.quotations = {
  title: 'Quotations',
  render: async function (el, params) {
    const f = { q: '', status: params.status || '', from: '', to: '', customerId: params.customerId || '' };
    el.innerHTML =
      '<div class="page-head"><div><h1>Quotations</h1><p>Price quotes for <b>' + esc(App.state.business.BusinessName) + '</b>. Convert a quotation to an invoice when the customer agrees.</p></div>' +
      '<div class="actions"><button class="btn" id="q-deleted">' + icon('trash') + '<span class="hide-sm"> Deleted</span></button><button class="btn btn-primary" data-go="new">' + icon('plus') + ' New quotation</button></div></div>' +
      '<div class="card"><div class="filters">' +
        '<div class="input-icon">' + icon('search') + '<input type="search" id="qf-q" placeholder="Search quotation no, customer, phone or job no"></div>' +
        '<select id="qf-status">' + Quotes.STATUSES.map(function (s) { return '<option value="' + s[0] + '" ' + (s[0] === f.status ? 'selected' : '') + '>' + s[1] + '</option>'; }).join('') + '</select>' +
        '<input type="date" id="qf-from" title="From date">' +
        '<input type="date" id="qf-to" title="To date">' +
        '<button class="btn btn-sm btn-ghost" id="qf-month">This month</button>' +
        '<button class="btn btn-sm btn-ghost" id="qf-clear">Clear</button>' +
      '</div><div id="q-sum"></div><div id="q-body"><div class="empty"><div class="spinner" style="margin:0 auto"></div></div></div></div>';

    const body = el.querySelector('#q-body'), sum = el.querySelector('#q-sum');
    let reqId = 0;
    const load = async function () {
      const my = ++reqId;
      body.style.opacity = '.55';
      try {
        const r = await API.call('quotations.list', f, { silent: true });
        if (my !== reqId) return;
        sum.innerHTML = '<div class="chips"><span><b>' + cnt(r.summary.count) + '</b> quotations</span><span>Quoted <b>' + money(r.summary.total) + '</b></span>' +
          '<span>Active <b>' + money(r.summary.active) + '</b></span><span>Converted <b style="color:var(--success)">' + money(r.summary.converted) + '</b> (' + cnt(r.summary.convertedCount) + ')</span>' +
          (r.truncated ? '<span>Showing the latest ' + r.quotations.length + ' - refine filters to see more</span>' : '') + '</div>';
        if (!r.quotations.length) {
          const filtered = f.q || f.status || f.from || f.to || f.customerId;
          body.innerHTML = filtered ? UI.empty('search', 'No quotations found', 'Try changing the search or filters.')
            : UI.empty('quote', 'No quotations yet', 'Send a price quote to a customer, then turn it into an invoice with one click.',
                '<button class="btn btn-primary mt-2" data-go="new">' + icon('plus') + ' New quotation</button>');
        } else {
          body.innerHTML = '<div class="table-wrap"><table class="table"><thead><tr><th>Quotation</th><th>Customer</th><th class="hide-sm">Date</th><th class="hide-sm">Valid until</th>' +
            '<th class="num">Total</th><th>Status</th><th></th></tr></thead><tbody>' +
            r.quotations.map(function (q) {
              const canConvert = q.Status !== 'Converted';
              return '<tr class="clickable' + (q.Status === 'Declined' || q.Status === 'Expired' ? ' t-voided' : '') + '" data-id="' + esc(q.QuoteId) + '">' +
                '<td class="strong nowrap">' + esc(q.QuoteNo) + (q.RefNo ? '<div class="small muted">' + esc(q.RefNo) + '</div>' : '') + '</td>' +
                '<td><div class="ellipsis" style="max-width:220px">' + esc(q.CustomerName || '-') + '</div><div class="small muted">' + esc(q.CustomerPhone || '') + '</div></td>' +
                '<td class="hide-sm nowrap">' + fmtDate(q.QuoteDate) + '</td><td class="hide-sm nowrap">' + fmtDate(q.ValidUntil) + '</td>' +
                '<td class="num nowrap amount">' + money(q.GrandTotal) + '</td>' +
                '<td>' + statusBadge(q.Status) + (q.InvoiceNo ? '<div class="small muted mt-1">' + esc(q.InvoiceNo) + '</div>' : '') + '</td>' +
                '<td class="actions nowrap right">' +
                  (canConvert ? '<button class="btn btn-sm btn-ghost btn-icon" title="Convert to invoice" data-conv="' + esc(q.QuoteId) + '">' + icon('invoice') + '</button>'
                              : '<button class="btn btn-sm btn-ghost btn-icon" title="Open invoice ' + esc(q.InvoiceNo) + '" data-inv="' + esc(q.InvoiceId) + '">' + icon('invoice') + '</button>') +
                  '<button class="btn btn-sm btn-ghost btn-icon" title="WhatsApp" data-wa="' + esc(q.QuoteId) + '">' + icon('whatsapp') + '</button>' +
                  '<button class="btn btn-sm btn-ghost btn-icon" title="Download PDF" data-pdf="' + esc(q.QuoteId) + '">' + icon('download') + '</button>' +
                '</td></tr>';
            }).join('') + '</tbody></table></div>';
          f._rows = r.quotations;
        }
        hydrateIcons(el);
      } catch (e) {
        if (my === reqId) body.innerHTML = '<div class="card-body"><div class="alert alert-error">' + icon('alert') + '<div>' + esc(e.message) + '</div></div></div>';
      } finally { body.style.opacity = ''; }
    };

    el.querySelector('#qf-q').oninput = debounce(function (e) { f.q = e.target.value.trim(); load(); }, 300);
    el.querySelector('#qf-status').onchange = function (e) { f.status = e.target.value; load(); };
    el.querySelector('#qf-from').onchange = function (e) { f.from = e.target.value; load(); };
    el.querySelector('#qf-to').onchange = function (e) { f.to = e.target.value; load(); };
    el.querySelector('#qf-month').onclick = function () {
      f.from = monthStart(); f.to = todayStr();
      el.querySelector('#qf-from').value = f.from; el.querySelector('#qf-to').value = f.to; load();
    };
    el.querySelector('#qf-clear').onclick = function () { App.go('quotations'); };
    el.querySelector('#q-deleted').onclick = async function () {
      try { if (await Quotes.deletedList()) load(); } catch (err) { UI.error(err); }
    };

    el.onclick = async function (e) {
      if (e.target.closest('[data-go="new"]')) return App.go('quotation-new');
      const conv = e.target.closest('[data-conv]'), inv = e.target.closest('[data-inv]');
      const wa = e.target.closest('[data-wa]'), pdf = e.target.closest('[data-pdf]');
      try {
        if (conv) {
          e.stopPropagation();
          const full = await API.call('quotations.get', { quoteId: conv.dataset.conv });
          const r = await Quotes.convert(full.invoice, full.quoteStatus);
          if (r) App.go('invoice-view', { id: r.InvoiceId });
          return;
        }
        if (inv) { e.stopPropagation(); return App.go('invoice-view', { id: inv.dataset.inv }); }
        if (wa) { e.stopPropagation(); return await Inv.whatsapp(wa.dataset.wa); }
        if (pdf) { e.stopPropagation(); return await Inv.pdf(pdf.dataset.pdf); }
      } catch (err) { return UI.error(err); }
      const row = e.target.closest('tr[data-id]');
      if (row) App.go('quotation-view', { id: row.dataset.id });
    };
    await load();
  }
};
